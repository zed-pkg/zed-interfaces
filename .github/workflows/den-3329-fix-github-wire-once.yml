name: correct registry namespace wire values once

on:
  push:
    branches:
      - alexanderdmills/den-3329-registry-namespace-contract-v1
    paths:
      - .github/workflows/den-3329-fix-github-wire-once.yml
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/den-3329-fix-github-wire-once.yml

permissions:
  contents: write

concurrency:
  group: den-3329-fix-github-wire
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  TARGET_BRANCH: alexanderdmills/den-3329-registry-namespace-contract-v1

jobs:
  fix:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/alexanderdmills/den-3329-registry-namespace-contract-v1') ||
      (github.event_name == 'pull_request' &&
       github.head_ref == 'alexanderdmills/den-3329-registry-namespace-contract-v1' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out exact generated contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Install declared tools
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc --version --verbose
          cargo --version --verbose
          node --version
          npm --version

      - name: Pin exact ecosystem wire spellings
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/rust/namespace_claim.rs')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '    GitHub,\n    GitLabCom,\n': (
                  '    #[serde(rename = "github")]\n'
                  '    GitHub,\n'
                  '    #[serde(rename = "gitlab-com")]\n'
                  '    GitLabCom,\n'
              ),
              '    GitHubAccountControl,\n': (
                  '    #[serde(rename = "github-account-control")]\n'
                  '    GitHubAccountControl,\n'
              ),
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'wire-value source anchor drifted: {old!r}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Regenerate and validate every public slice
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo run --locked --example generate_schemas
          npm run codegen
          npm test
          git diff --check

          grep -R -F 'github' schemas/registry-namespace-*.json src/ts/registry-namespace-*.ts src/ts/common.ts src/dart/lib/registry_namespace_*.dart src/dart/lib/common.dart
          if grep -R -E 'git-hub|git-lab-com|git-hub-account-control' \
            schemas/registry-namespace-*.json \
            src/ts/registry-namespace-*.ts src/ts/common.ts \
            src/dart/lib/registry_namespace_*.dart src/dart/lib/common.dart; then
            echo 'noncanonical forge wire spelling remains' >&2
            exit 1
          fi

      - name: Remove one-shot workflow and publish corrected generated bytes
        run: |
          set -euo pipefail
          rm .github/workflows/den-3329-fix-github-wire-once.yml
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(DEN-3329): use canonical GitHub namespace wire values"
          git push origin HEAD:${TARGET_BRANCH}