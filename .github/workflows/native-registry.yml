name: native registry contract

on:
  pull_request:
    paths:
      - docs/native-registry-contract.md
      - src/rust/examples/generate_schemas.rs
      - schemas/native-registry-adapter-record.json
      - src/rust/lib.rs
      - src/rust/native_registry.rs
      - src/rust/tests/native_registry_schema_contract.rs
      - .github/workflows/native-registry.yml
  push:
    branches: [main]
    paths:
      - docs/native-registry-contract.md
      - src/rust/examples/generate_schemas.rs
      - schemas/native-registry-adapter-record.json
      - src/rust/lib.rs
      - src/rust/native_registry.rs
      - src/rust/tests/native_registry_schema_contract.rs
      - .github/workflows/native-registry.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-registry-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  contract:
    name: native registry / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Normalize generated-schema line endings
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - name: Install Rust quality components
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version --verbose
          cargo --version --verbose

      - name: Validate native publication contract
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo test --locked native_registry
          cargo test --locked --test native_registry_schema_contract
          cargo clippy --locked --lib --test native_registry_schema_contract -- -D warnings

      - name: Require deterministic generated schema
        run: |
          set -euo pipefail
          cargo run --locked --example generate_schemas
          git diff --exit-code -- schemas

      - name: Require a clean checkout
        run: |
          set -euo pipefail
          git diff --exit-code
          git status --porcelain=v1 --untracked-files=all | tee "$RUNNER_TEMP/native-registry-status.txt"
          test ! -s "$RUNNER_TEMP/native-registry-status.txt"
