name: TypeSpec and JSON Schema Contract IR admission

on:
  pull_request:
    paths:
      - "schema-authority-canary/**"
      - "contract-admission/contract-ir-consumer.json"
      - ".github/workflows/typespec-json-schema-peer-authority.yml"
  push:
    branches: [main, dev]
    paths:
      - "schema-authority-canary/**"
      - "contract-admission/contract-ir-consumer.json"
      - ".github/workflows/typespec-json-schema-peer-authority.yml"
  schedule:
    - cron: "43 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-ir-admission-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify checked-out revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up the tested Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
      - name: Verify repository-owned consumer policy
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const manifest = JSON.parse(readFileSync("contract-admission/contract-ir-consumer.json", "utf8"));
          assert.equal(manifest.schema, "ores.contract-ir-consumer/v1");
          assert.equal(manifest.repository, process.env.GITHUB_REPOSITORY);
          assert.equal(manifest.repositoryRole, "interfaces");
          assert.equal(manifest.canonicalAuthorityRepository, process.env.GITHUB_REPOSITORY);
          assert.equal(manifest.validator.repository, "ORESoftware/typespec-json-schema-validator");
          assert.equal(manifest.validator.actionCommit, "93dd73cb246a09b0a1c62d7192cc62ca6ecbe405");
          assert.equal(manifest.validator.contractIrSchema, "ores.typespec-json-schema-validator.contract-ir/v1");
          assert.equal(manifest.authorityModel.precedence, "none");
          assert.equal(manifest.admission.allowFallbackAuthority, false);
          NODE
      - name: Compare peer authorities and emit fresh Contract IR
        uses: ORESoftware/typespec-json-schema-validator@93dd73cb246a09b0a1c62d7192cc62ca6ecbe405
        with:
          typespec: schema-authority-canary/main.tsp
          schema: schema-authority-canary/authored.schema.json
          report: .typespec-json-schema-validator/report.json
          sarif: .typespec-json-schema-validator/report.sarif
          contract_ir: .typespec-json-schema-validator/contract-ir.json
          output_dir: .typespec-json-schema-validator/generated
          max_probes: "64"
      - name: Verify both authored authorities and generated comparison witness
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const report = JSON.parse(readFileSync(".typespec-json-schema-validator/report.json", "utf8"));
          const generated = JSON.parse(readFileSync(".typespec-json-schema-validator/generated/typespec.generated.schema.json", "utf8"));
          assert.equal(report.status, "passed");
          assert.equal(report.zeroUnexplainedFindings, true);
          assert.equal(report.authorities.typespec.authority, "independently-authored");
          assert.equal(report.authorities.typespec.generatedJsonSchemaRole, "comparison-evidence-only");
          assert.equal(report.authorities.jsonSchema.authority, "independently-authored");
          assert.equal(report.authorities.jsonSchema.dialect, "https://json-schema.org/draft/2020-12/schema");
          assert.equal(report.authorities.precedence, "none");
          assert.equal(report.coverage.typespecGeneratedJsonSchemaComparison, true);
          assert.equal(report.coverage.differentialInstanceValidation, true);
          assert.equal(generated.$schema, "https://json-schema.org/draft/2020-12/schema");
          NODE
      - name: Require positive admission and canonical refusals
        uses: ORESoftware/typespec-json-schema-validator/actions/test-consumer-admission@93dd73cb246a09b0a1c62d7192cc62ca6ecbe405
        with:
          contract_ir: .typespec-json-schema-validator/contract-ir.json
          report: .typespec-json-schema-validator/report.json
          typespec: schema-authority-canary/main.tsp
          schema: schema-authority-canary/authored.schema.json
          generated_schema: .typespec-json-schema-validator/generated/typespec.generated.schema.json
          expected_declarations: '["OreSchemaAuthority.AuthorityKind","OreSchemaAuthority.PeerAuthorityRegistration"]'
          verification: .typespec-json-schema-validator/consumer-verification.json
      - name: Retain receipt, Contract IR, SARIF, generated witness, and admission evidence
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contract-ir-admission-${{ github.event.repository.name }}-${{ github.run_id }}
          path: .typespec-json-schema-validator/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
