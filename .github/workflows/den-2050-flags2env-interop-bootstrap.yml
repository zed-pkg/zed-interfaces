name: DEN-2050 flags-2-env manifest interop bootstrap

on:
  push:
    branches: [DEN-2050-flags2env-cli-contract]
    paths:
      - '.github/workflows/den-2050-flags2env-interop-bootstrap.yml'

permissions:
  contents: write

concurrency:
  group: den-2050-flags2env-interop-bootstrap
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: DEN-2050-flags2env-cli-contract
          persist-credentials: true
          show-progress: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt,clippy

      - name: Add typed flags-2-env interop contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          manifest_path = Path('src/rust/manifest.rs')
          text = manifest_path.read_text()
          if 'pub flags_2_env: Flags2EnvInteropSection' not in text:
              old = '''/// Opt-in interoperability with repository-local metadata owned by other tools.
          #[derive(Debug, Clone, PartialEq, Default, Serialize, Deserialize, JsonSchema)]
          #[serde(default)]
          pub struct InteropSection {
              #[serde(skip_serializing_if = "GitInteropSection::is_empty")]
              pub git: GitInteropSection,
          }

          impl InteropSection {
              pub fn is_empty(&self) -> bool {
                  self.git.is_empty()
              }
          }

          /// Explicit permission for Zed to consume metadata committed for Git.
          '''
              new = '''/// Opt-in interoperability with repository-local metadata owned by other tools.
          #[derive(Debug, Clone, PartialEq, Default, Serialize, Deserialize, JsonSchema)]
          #[serde(default)]
          pub struct InteropSection {
              #[serde(skip_serializing_if = "GitInteropSection::is_empty")]
              pub git: GitInteropSection,
              /// Bind installed CLI entry points to one package-owned flags-2-env contract.
              /// Zed uses this explicit path rather than discovering configuration from
              /// the consumer's working directory.
              #[serde(
                  rename = "flags-2-env",
                  alias = "flags2env",
                  skip_serializing_if = "Flags2EnvInteropSection::is_empty"
              )]
              pub flags_2_env: Flags2EnvInteropSection,
          }

          impl InteropSection {
              pub fn is_empty(&self) -> bool {
                  self.git.is_empty() && self.flags_2_env.is_empty()
              }
          }

          /// Explicit flags-2-env binding for binaries exposed by this package.
          #[derive(Debug, Clone, PartialEq, Default, Serialize, Deserialize, JsonSchema)]
          #[serde(default)]
          pub struct Flags2EnvInteropSection {
              /// Path to the package-owned `.cli-flags.toml`, relative to the package root.
              #[serde(skip_serializing_if = "Option::is_none")]
              pub config: Option<String>,
              /// `[bin]` entries whose execution must receive `FLAGS2ENV_CONFIG`.
              #[serde(skip_serializing_if = "Vec::is_empty")]
              pub bins: Vec<String>,
          }

          impl Flags2EnvInteropSection {
              pub fn is_empty(&self) -> bool {
                  self.config.is_none() && self.bins.is_empty()
              }
          }

          /// Explicit permission for Zed to consume metadata committed for Git.
          '''
              if old not in text:
                  raise SystemExit('InteropSection anchor not found')
              text = text.replace(old, new, 1)

              marker = '        let overriding = self.overrides.build.values();\n'
              validation = '''        if !self.interop.flags_2_env.is_empty() {
              let interop = &self.interop.flags_2_env;
              let config = interop
                  .config
                  .as_deref()
                  .map(str::trim)
                  .filter(|value| !value.is_empty())
                  .ok_or_else(|| {
                      ManifestError::InvalidFlags2EnvInterop(
                          "config must name the package-owned flags contract".to_string(),
                      )
                  })?;
              if !is_safe_relative_path(config) {
                  return Err(ManifestError::InvalidFlags2EnvInterop(format!(
                      "config `{config}` must be a relative path without `..`"
                  )));
              }
              if interop.bins.is_empty() {
                  return Err(ManifestError::InvalidFlags2EnvInterop(
                      "bins must explicitly name at least one [bin] entry".to_string(),
                  ));
              }
              let mut bound = BTreeSet::new();
              for bin in &interop.bins {
                  if !bound.insert(bin.as_str()) {
                      return Err(ManifestError::InvalidFlags2EnvInterop(format!(
                          "bin `{bin}` is listed more than once"
                      )));
                  }
                  if !self.bin.contains_key(bin) {
                      return Err(ManifestError::InvalidFlags2EnvInterop(format!(
                          "bin `{bin}` is not declared in [bin]"
                      )));
                  }
              }
              if let Some(build) = &self.build {
                  if !build.outputs.is_empty()
                      && !build.outputs.iter().any(|output| output == config)
                  {
                      return Err(ManifestError::InvalidFlags2EnvInterop(format!(
                          "build.outputs must retain flags contract `{config}`"
                      )));
                  }
              }
          }
          '''
              if marker not in text:
                  raise SystemExit('build-validation insertion marker not found')
              text = text.replace(marker, validation + marker, 1)

              old = '''    #[error("invalid bin entry `{0}`: {1}")]
              InvalidBin(String, String),
              #[error("invalid build section: {0}")]
          '''
              new = '''    #[error("invalid bin entry `{0}`: {1}")]
              InvalidBin(String, String),
              #[error("invalid [interop.flags-2-env] section: {0}")]
              InvalidFlags2EnvInterop(String),
              #[error("invalid build section: {0}")]
          '''
              if old not in text:
                  raise SystemExit('ManifestError anchor not found')
              text = text.replace(old, new, 1)
              manifest_path.write_text(text)

          tests_path = Path('src/rust/tests/roundtrip.rs')
          tests = tests_path.read_text()
          if 'flags2env_cli_interop_is_typed_and_fail_closed' not in tests:
              anchor = '''#[test]
          fn package_artifacts_roundtrip_and_validate() {
          '''
              addition = r'''#[test]
          fn flags2env_cli_interop_is_typed_and_fail_closed() {
              let valid = format!(
                  "{SAMPLE}\n[bin]\ntjsv = \"bin/tjsv\"\ntsjsv = \"bin/tjsv\"\n\n[interop.flags-2-env]\nconfig = \".cli-flags.toml\"\nbins = [\"tjsv\", \"tsjsv\"]\n"
              );
              let manifest = Manifest::parse(&valid).expect("valid flags2env interop");
              assert_eq!(
                  manifest.interop.flags_2_env.config.as_deref(),
                  Some(".cli-flags.toml")
              );
              assert_eq!(
                  manifest.interop.flags_2_env.bins,
                  vec!["tjsv".to_owned(), "tsjsv".to_owned()]
              );
              let serialized = manifest.to_toml_string().expect("serialize manifest");
              assert!(serialized.contains("[interop.flags-2-env]"));
              assert_eq!(Manifest::parse(&serialized).unwrap(), manifest);

              for invalid in [
                  format!(
                      "{SAMPLE}\n[bin]\ntjsv = \"bin/tjsv\"\n\n[interop.flags-2-env]\nbins = [\"tjsv\"]\n"
                  ),
                  format!(
                      "{SAMPLE}\n[bin]\ntjsv = \"bin/tjsv\"\n\n[interop.flags-2-env]\nconfig = \"../.cli-flags.toml\"\nbins = [\"tjsv\"]\n"
                  ),
                  format!(
                      "{SAMPLE}\n[bin]\ntjsv = \"bin/tjsv\"\n\n[interop.flags-2-env]\nconfig = \".cli-flags.toml\"\nbins = [\"missing\"]\n"
                  ),
                  format!(
                      "{SAMPLE}\n[bin]\ntjsv = \"bin/tjsv\"\n\n[interop.flags-2-env]\nconfig = \".cli-flags.toml\"\nbins = [\"tjsv\", \"tjsv\"]\n"
                  ),
                  format!(
                      "{SAMPLE}\n[build]\ncommand = \"cargo build\"\noutputs = [\"target/release/tjsv\"]\n\n[bin]\ntjsv = \"target/release/tjsv\"\n\n[interop.flags-2-env]\nconfig = \".cli-flags.toml\"\nbins = [\"tjsv\"]\n"
                  ),
              ] {
                  assert!(matches!(
                      Manifest::parse(&invalid),
                      Err(ManifestError::InvalidFlags2EnvInterop(_))
                  ));
              }
          }

          #[test]
          fn package_artifacts_roundtrip_and_validate() {
          '''
              if anchor not in tests:
                  raise SystemExit('roundtrip test anchor not found')
              tests = tests.replace(anchor, addition, 1)
              tests_path.write_text(tests)
          PY

      - name: Format, test, and regenerate cross-language schemas
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo test --locked
          cargo run --locked --example generate_schemas
          node codegen/generate.mjs
          cargo clippy --locked --all-targets -- -D warnings

      - name: Commit generated contract and tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/rust/manifest.rs src/rust/tests/roundtrip.rs schemas/manifest.json src/ts src/dart
          if git diff --cached --quiet; then
            echo 'No generated changes remain.'
            exit 0
          fi
          git diff --cached --stat
          git commit -m 'feat(DEN-2050): add flags-2-env CLI package interop'
          git push origin HEAD:refs/heads/DEN-2050-flags2env-cli-contract
