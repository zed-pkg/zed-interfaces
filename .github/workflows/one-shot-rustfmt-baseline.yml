name: one-shot rustfmt baseline repair

on:
  push:
    branches:
      - chore/rustfmt-source-composition-baseline

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Format with repository toolchain and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rustup component add rustfmt
          cargo fmt --all
          rm .github/workflows/one-shot-rustfmt-baseline.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No formatting changes were needed.'
            exit 0
          fi
          git commit -m 'style: repair rustfmt baseline'
          git push origin HEAD:chore/rustfmt-source-composition-baseline
