name: Promote DEN-3970 tested artifact

on:
  push:
    branches:
      - fix/DEN-3970-flags2env-build-output-retention
    paths:
      - .github/workflows/promote-den3970-artifact.yml

permissions:
  actions: read
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ARTIFACT_ID: "10275086247"
      EXPECTED_MANIFEST_SHA256: b774ace54f573af75a703b1b34accc10087d4176dd451a611dd2a2b7abff818b
      EXPECTED_ROUNDTRIP_SHA256: 8e8fd7c1e74a7bef0f1ce529c5858fe778dcc388f4040c8a4e6d329b90290556
    steps:
      - name: Check out exact promoter head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
          show-progress: false

      - name: Verify exact checkout and download certified artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/den3970"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > "$RUNNER_TEMP/den3970.zip"
          unzip -q "$RUNNER_TEMP/den3970.zip" -d "$RUNNER_TEMP/den3970"

      - name: Verify artifact identity and exact authored bytes
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/den3970"
          test -f "$root/src/rust/manifest.rs"
          test -f "$root/src/rust/tests/roundtrip.rs"
          test "$(sha256sum "$root/src/rust/manifest.rs" | awk '{print $1}')" = "$EXPECTED_MANIFEST_SHA256"
          test "$(sha256sum "$root/src/rust/tests/roundtrip.rs" | awk '{print $1}')" = "$EXPECTED_ROUNDTRIP_SHA256"
          grep -Fq 'build section is required to retain the flags contract' "$root/src/rust/manifest.rs"
          grep -Fq 'build.outputs must be nonempty and retain flags contract' "$root/src/rust/manifest.rs"

      - name: Promote only the certified authored files
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/den3970"
          cp "$root/src/rust/manifest.rs" src/rust/manifest.rs
          cp "$root/src/rust/tests/roundtrip.rs" src/rust/tests/roundtrip.rs
          git diff --check
          actual="$(git status --porcelain | sed -E 's/^.. //' | sed '/^$/d' | sort)"
          expected=$'src/rust/manifest.rs\nsrc/rust/tests/roundtrip.rs'
          test "$actual" = "$expected" || {
            printf 'unexpected promoted paths:\n%s\n' "$actual" >&2
            exit 1
          }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/rust/manifest.rs src/rust/tests/roundtrip.rs
          git commit -m 'fix(DEN-3970): require flags2env build output retention'
          git push origin HEAD:fix/DEN-3970-flags2env-build-output-retention
