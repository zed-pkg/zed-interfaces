name: format environment lock v1

on:
  push:
    branches:
      - agent/environment-lock-v1
    paths:
      - .github/workflows/format-environment-lock-v1.yml

permissions:
  contents: write

concurrency:
  group: format-environment-lock-v1
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/environment-lock-v1
          persist-credentials: true
          show-progress: false

      - name: Install rustfmt
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt

      - name: Format and commit ordinary source
        run: |
          set -euo pipefail
          cargo fmt --all
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/environment_lock.rs src/lib.rs examples/generate_environment_lock_schema.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git diff --cached --check
          git commit -m 'style: format environment lock contract'
          git push origin HEAD:agent/environment-lock-v1
