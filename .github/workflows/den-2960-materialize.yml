name: DEN-2960 materialize canonical root target contract

on:
  push:
    branches:
      - agent/den-2960-canonical-root-target-contract
    paths:
      - .github/workflows/den-2960-materialize.yml

permissions:
  contents: write

concurrency:
  group: den-2960-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact bootstrap branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-2960-canonical-root-target-contract
          fetch-depth: 2
          persist-credentials: true
          show-progress: false

      - name: Verify bootstrap parent and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "d1bf8ef7c88a75292cbe8d697bfd269f30d62e2b"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/den-2960-materialize.yml"

      - name: Apply narrow contract repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          manifest_path = Path("src/manifest.rs")
          manifest = manifest_path.read_text()

          manifest = replace_once(
              manifest,
              '''    /// Published package name for this target. Defaults to
    /// `<package.name>-<target key>` (e.g. `fiducia-clients-java`). Set it to
    /// break out of the suffix convention when an ecosystem expects a
    /// different spelling.
''',
              '''    /// Published package name for this target. Non-root targets default to
    /// `<package.name>-<target key>` (e.g. `fiducia-clients-java`) and may
    /// override that convention here. A whole-repository target (`dir = "."`)
    /// always publishes as the root `package.name`; omit `name` there or repeat
    /// the canonical root name. A different root-target name is invalid.
''',
              "target-name docs",
          )

          manifest = replace_once(
              manifest,
              '''            let published_name = target
                .name
                .clone()
                .unwrap_or_else(|| format!("{}-{name}", self.package.name));
''',
              '''            let published_name = if target.dir == "." {
                if let Some(explicit) = target.name.as_deref()
                    && explicit != self.package.name
                {
                    return Err(ManifestError::InvalidTarget(
                        name.clone(),
                        format!(
                            "whole-repository target publishes as canonical package `{}`; omit `name` or set it to that value, not `{explicit}`",
                            self.package.name
                        ),
                    ));
                }
                self.package.name.clone()
            } else {
                target
                    .name
                    .clone()
                    .unwrap_or_else(|| format!("{}-{name}", self.package.name))
            };
''',
              "published-name computation",
          )

          manifest = replace_once(
              manifest,
              '''            if published_name == self.package.name {
''',
              '''            if target.dir != "." && published_name == self.package.name {
''',
              "non-root collision guard",
          )

          manifest = replace_once(
              manifest,
              '''    /// The package name a target publishes under: its explicit `name`, else
    /// the `<name>-<target>` convention (`fiducia-clients` + `java` →
    /// `fiducia-clients-java`).
    pub fn target_package_name(&self, target: &str) -> Option<String> {
        self.targets.get(target).map(|t| {
            t.name
                .clone()
                .unwrap_or_else(|| format!("{}-{}", self.package.name, target))
        })
    }
''',
              '''    /// The package name a target publishes under. A whole-repository target
    /// (`dir = "."`) is the canonical root package and therefore uses
    /// `package.name`; non-root targets use their explicit `name` or the
    /// `<name>-<target>` convention (`fiducia-clients` + `java` →
    /// `fiducia-clients-java`).
    pub fn target_package_name(&self, target: &str) -> Option<String> {
        self.targets.get(target).map(|section| {
            if section.dir == "." {
                self.package.name.clone()
            } else {
                section
                    .name
                    .clone()
                    .unwrap_or_else(|| format!("{}-{}", self.package.name, target))
            }
        })
    }
''',
              "target_package_name",
          )

          manifest = replace_once(
              manifest,
              '''                    package: section
                        .name
                        .clone()
                        .unwrap_or_else(|| format!("{}-{target}", self.package.name)),
''',
              '''                    package: self
                        .target_package_name(target)
                        .expect("target iterated from manifest exists"),
''',
              "nix target package identity",
          )

          manifest_path.write_text(manifest)

          roundtrip_path = Path("tests/roundtrip.rs")
          roundtrip = roundtrip_path.read_text()
          marker = '''\n#[test]\nfn the_per_target_manifest_is_a_standalone_single_language_package() {\n'''
          if roundtrip.count(marker) != 1:
              raise SystemExit(f"test insertion marker: expected one match, found {roundtrip.count(marker)}")
          tests = r'''

#[test]
fn whole_repository_target_uses_the_canonical_root_identity() {
    let root = format!("{CLIENTS}\n[targets.repository]\ndir = \".\"\n");
    let manifest = Manifest::parse(&root).unwrap();
    assert_eq!(
        manifest.target_package_name("repository").as_deref(),
        Some("fiducia-clients")
    );
    assert!(manifest.target_package_names().contains(&(
        "repository".to_string(),
        "fiducia-clients".to_string()
    )));

    let packaged = manifest
        .manifest_for_target("repository")
        .expect("repository target exists");
    assert_eq!(packaged.package.name, "fiducia-clients");
    assert_eq!(packaged.full_name(), "fiducia/fiducia-clients");
    assert!(!packaged.is_polyglot());

    let explicit_canonical = format!(
        "{CLIENTS}\n[targets.repository]\ndir = \".\"\nname = \"fiducia-clients\"\n"
    );
    let manifest = Manifest::parse(&explicit_canonical).unwrap();
    assert_eq!(
        manifest.target_package_name("repository").as_deref(),
        Some("fiducia-clients")
    );
}

#[test]
fn whole_repository_target_rejects_a_conflicting_explicit_name() {
    let conflicting = format!(
        "{CLIENTS}\n[targets.repository]\ndir = \".\"\nname = \"fiducia-clients-repository\"\n"
    );
    let error = Manifest::parse(&conflicting)
        .expect_err("a root target cannot advertise an identity the packer will not publish");
    let message = error.to_string();
    assert!(message.contains("whole-repository target"), "{message}");
    assert!(message.contains("fiducia-clients"), "{message}");
    assert!(message.contains("fiducia-clients-repository"), "{message}");
}
'''
          roundtrip = roundtrip.replace(marker, tests + marker, 1)
          roundtrip_path.write_text(roundtrip)
          PY

          rm .github/workflows/den-2960-materialize.yml
          cargo fmt --all

      - name: Run focused contract tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --test roundtrip target
          cargo test --locked --test roundtrip whole_repository_target
          cargo check --locked --lib
          git diff --check

      - name: Commit verified materialization and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DEN-2960 materializer"
          git config user.email "actions@users.noreply.github.com"
          git add src/manifest.rs tests/roundtrip.rs .github/workflows/den-2960-materialize.yml
          expected=$'.github/workflows/den-2960-materialize.yml\nsrc/manifest.rs\ntests/roundtrip.rs'
          test "$(git diff --cached --name-only)" = "$expected"
          git commit -m "fix(DEN-2960): align canonical root target identity"
          git push origin HEAD:agent/den-2960-canonical-root-target-contract
