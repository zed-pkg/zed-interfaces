name: DEN-2854 immutable snapshot reconciliation

on:
  push:
    branches:
      - alexanderdmills/den-2854-registry-protocol-v1-rfc-registry-identity-sparse-index

permissions:
  contents: write

concurrency:
  group: den-2854-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Apply exact reviewed source transformation
        run: python3 .github/den-2854-snapshot-reconcile.py

      - name: Format, test, lint, and regenerate schemas
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo test --locked registry_protocol_v1
          cargo clippy --locked --all-targets -- -D warnings
          cargo run --locked --example generate_schemas
          cargo test --locked registry_protocol_v1
          git diff --check

      - name: Commit materialized protocol and delete one-use machinery
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "zed-pkg protocol reconciler"
          git config user.email "protocol-reconciler@users.noreply.github.com"
          git add \
            src/registry_protocol_v1.rs \
            src/lib.rs \
            examples/generate_schemas.rs \
            fixtures/registry-v1/discovery.json \
            fixtures/registry-v1/index-snapshot.json \
            schemas/registry-discovery-v1.json \
            schemas/registry-index-snapshot-v1.json
          git rm \
            .github/den-2854-snapshot-reconcile.py \
            .github/workflows/den-2854-snapshot-reconciliation.yml
          git diff --cached --check
          git commit -m "DEN-2854 authenticate immutable sparse-index snapshots"
          git push origin "HEAD:${TARGET_BRANCH}"
