name: TJSV production public admission regressions
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tjsv-regressions-${{ github.ref }}
  cancel-in-progress: true
jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/typespec-json-schema-validator
          ref: b5bd51946b53c00b1daeb2723c0b5d54eaeafab7
          path: tmp/tjsv-validator
          persist-credentials: false
      - name: Install the tested validator toolchain
        run: npm ci --prefix tmp/tjsv-validator --omit=dev
      - name: Materialize the independently recorded public corpus
        run: |
          node --input-type=module <<'NODE'
          import { readFile, mkdir, writeFile } from 'node:fs/promises';
          import { validateCorpus } from './validation/compiler/public-parity.mjs';
          const corpus = validateCorpus(JSON.parse(await readFile('validation/compiler/cases.json', 'utf8')));
          for (const item of corpus.cases) {
            const dir = `tmp/tjsv-admission/instances/${item.declaration}/${item.valid ? 'valid' : 'invalid'}`;
            await mkdir(dir, { recursive: true });
            await writeFile(`${dir}/${item.id}.json`, JSON.stringify(item.value), { flag: 'wx' });
          }
          NODE
      - name: Compile both public authorities without weakening format or closure policy
        run: |
          node tmp/tjsv-validator/bin/typespec-json-schema-validator.mjs check \
            --typespec=validation/typespec/validation.tsp \
            --schema=validation/public-contracts.v1.json \
            --instances=tmp/tjsv-admission/instances \
            --output-dir=tmp/tjsv-admission/generated \
            --report=tmp/tjsv-admission/report.json \
            --contract-ir=tmp/tjsv-admission/contract-ir.json \
            --seal-object-schemas=false --format-assertion=true --probes=true --max-probes=64 --quiet
      - name: Require current evidence and seven rejection regressions
        uses: ORESoftware/typespec-json-schema-validator/actions/test-consumer-admission@b5bd51946b53c00b1daeb2723c0b5d54eaeafab7
        with:
          contract_ir: tmp/tjsv-admission/contract-ir.json
          report: tmp/tjsv-admission/report.json
          typespec: validation/typespec/validation.tsp
          schema: validation/public-contracts.v1.json
          generated_schema: tmp/tjsv-admission/generated/typespec.generated.schema.json
          expected_declarations: '["Zed.Validation.RequestMeta","Zed.Validation.PageQuery","Zed.Validation.ProblemDetails","Zed.Validation.PublicValidationContract"]'
          verification: tmp/tjsv-admission/regression-verification.json
      - name: Preserve independent authorities and recorded expectations
        run: git diff --exit-code -- validation/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: tjsv-admission-${{ github.event.pull_request.head.sha || github.sha }}
          path: tmp/tjsv-admission/
          if-no-files-found: error
          retention-days: 14
# DEN-3828 / upstream issue #20. This certifies these four public data declarations,
# not private schemas, runtime implementations, SQL catalogs, or ORM behavior.
# All existing native checks remain in force; branch protection is configured separately.
