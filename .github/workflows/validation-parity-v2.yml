name: validation-parity-v2

on:
  pull_request:
    paths:
      - "validation/**"
      - "generated/**"
      - ".github/workflows/validation-parity-v2.yml"
  push:
    branches: [main]
    paths:
      - "validation/**"
      - "generated/**"
      - ".github/workflows/validation-parity-v2.yml"

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify reviewed source revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ORESoftware/api-docs
          ref: 9dd5f6310df252c7b4970ba53c2aad5e30e9cf6b
          path: .deps/api-docs
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ORESoftware/typespec-json-schema-validator
          ref: 03ccc0ecdfc70f9198c3ccf80718910961d3fde1
          path: .deps/typespec-json-schema-validator
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.16.0"
      - name: Audit and install the locked canonical compiler and CLI native addon
        env:
          TSJSV_NPM_AUDIT_RECEIPT: ${{ runner.temp }}/tjsv-npm-audit-receipt.json
        run: |
          test "$(git -C .deps/typespec-json-schema-validator rev-parse HEAD)" = 03ccc0ecdfc70f9198c3ccf80718910961d3fde1
          git -C .deps/typespec-json-schema-validator diff --exit-code HEAD
          node .deps/typespec-json-schema-validator/scripts/npm-audit-gate.mjs
          npm ci --prefix .deps/typespec-json-schema-validator
      - name: Admit the actual public contracts with recorded behavioral evidence
        run: node validation/compiler/public-parity.mjs
      - name: Reject source drift and wrong recorded expectations
        run: node --test validation/compiler/public-parity.test.mjs
      - name: Self-test existing peer-authority comparators
        run: |
          node validation/parity/orm-annotation-check.mjs --self-test
          node .deps/api-docs/tools/validation-parity/parity-tool.mjs --self-test
      - name: Verify private ORM annotations
        run: node validation/parity/orm-annotation-check.mjs --check
      - name: Verify existing generated runtime types and parity receipts
        run: node .deps/api-docs/tools/validation-parity/parity-tool.mjs --check
      - name: Generate parity candidates after a drift failure
        if: ${{ failure() }}
        run: node .deps/api-docs/tools/validation-parity/parity-tool.mjs --write
      - name: Retain generated parity candidates for review
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: parity-candidates-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            generated/final/
            generated/candidates/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Assert browser and edge exports exclude server models
        shell: bash
        run: |
          set -euo pipefail
          for runtime in browser edge; do
            if grep -R -nE 'Registry(Package|Version|Lease)Row' \
              "generated/final/typescript/runtime/${runtime}"; then
              echo "server persistence model leaked into ${runtime} exports" >&2
              exit 1
            fi
          done
      - name: Preserve validator and authored sources
        run: |
          git -C .deps/typespec-json-schema-validator diff --exit-code HEAD
          git diff --exit-code -- validation/typespec validation/public-contracts.v1.json validation/compiler/cases.json
