name: Bootstrap native lockfile provenance

on:
  push:
    branches:
      - agent/native-lockfile-provenance
  pull_request:
    branches:
      - agent/native-dependency-range-lock
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-native-lockfile-provenance
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out exact product branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/native-lockfile-provenance
          fetch-depth: 0
          persist-credentials: true

      - name: Install stable Rust with formatter and Clippy
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version --verbose
          cargo --version --verbose

      - name: Format and generate checked-in schemas
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo run --locked --example generate_schemas
          test -s schemas/lockfile.json
          git diff --check

      - name: Validate complete crate
        run: |
          set -euo pipefail
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets --all-features -- -D warnings
          git diff --check

      - name: Commit only the reviewed product result
        run: |
          set -euo pipefail
          git rm .github/workflows/bootstrap-native-lockfile-provenance.yml
          git add src/lockfile.rs \
            schemas/lockfile.json \
            tests/native_dependency_lockfile_contract.rs \
            tests/native_dependency_lockfile_schema_contract.rs \
            docs/native-dependency-lockfile.md
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(DEN-1565): materialize native lockfile provenance"
          git push origin HEAD:agent/native-lockfile-provenance
