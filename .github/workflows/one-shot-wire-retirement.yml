name: one-shot wire retirement module

on:
  push:
    branches:
      - feat/hex-parity-retirement-contract

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Wire retirement module and validate focused contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/rust/lib.rs')
          text = path.read_text()
          if 'pub mod retirement;\n' not in text:
              anchor = 'pub mod registry_protocol_v1;\n'
              if anchor not in text:
                  raise SystemExit('module anchor drifted')
              text = text.replace(anchor, anchor + 'pub mod retirement;\n', 1)
          export = '''pub use retirement::{\n    MAX_RETIREMENT_MESSAGE_CHARS, RETIRE_AUDIT_ACTION, RetireRequest, RetireResponse, Retirement,\n    RetirementError, RetirementReason, UNRETIRE_AUDIT_ACTION, retirement_path,\n};\n'''
          if 'pub use retirement::{' not in text:
              anchor = 'pub use signing::{\n'
              if anchor not in text:
                  raise SystemExit('export anchor drifted')
              text = text.replace(anchor, export + anchor, 1)
          path.write_text(text)
          PY
          cargo fmt --all -- --check
          cargo test --locked --manifest-path src/rust/Cargo.toml retirement
          rm .github/workflows/one-shot-wire-retirement.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: wire retirement contract on refreshed main'
          git push origin HEAD:feat/hex-parity-retirement-contract
