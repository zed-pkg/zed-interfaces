name: Bootstrap native dependency range hardening

on:
  push:
    branches:
      - agent/native-dependency-range-lock
  pull_request:
    branches:
      - agent/native-registry-semver-contract
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-native-dependency-range-hardening
  cancel-in-progress: true

jobs:
  harden:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out exact product branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/native-dependency-range-lock
          fetch-depth: 0
          persist-credentials: true

      - name: Install stable Rust with formatter and Clippy
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version --verbose
          cargo --version --verbose

      - name: Apply reviewed standards hardening
        run: |
          set -euo pipefail
          python3 scripts/den1507_harden_native_ranges.py
          cargo fmt --all
          cargo run --locked --example generate_schemas
          git diff --check

      - name: Validate complete crate
        run: |
          set -euo pipefail
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets --all-features -- -D warnings
          git diff --check

      - name: Commit only the product result
        run: |
          set -euo pipefail
          git rm .github/workflows/bootstrap-native-dependency-range-hardening.yml
          git rm scripts/den1507_harden_native_ranges.py
          git add src/native_dependency.rs docs/native-dependency-lock.md \
            schemas/native-dependency-lock.json \
            tests/native_dependency_schema_contract.rs
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(DEN-1507): preserve native comparator edge semantics"
          git push origin HEAD:agent/native-dependency-range-lock
