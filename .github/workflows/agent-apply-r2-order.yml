name: Apply R2-first locator repair

on:
  push:
    branches:
      - fix/r2-before-cloudflare-github-20260910

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/r2-before-cloudflare-github-20260910
          fetch-depth: 1
          persist-credentials: true
          show-progress: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt

      - name: Apply semantic locator-order patch
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/rust/source.rs')
          text = path.read_text(encoding='utf-8')

          old = '''    keys.push(format!(
                  "{R2_GITHUB_PREFIX}/{}/{}/{}/{}-{}.{}",
                  github.owner, github.repo, query.vcs_tag, query.name, query.version, ext
              ));
              keys.push(format!(
                  "{R2_PACKAGE_PREFIX}/{}/{}/{}/{}-{}.{}",
                  query.org, query.name, query.version, query.name, query.version, ext
              ));
              if let Some(sha256) = query.sha256.filter(|digest| !digest.is_empty()) {
                  keys.push(format!("{R2_CONTENT_PREFIX}/{sha256}.{ext}"));
              }
          '''
          new = '''    // A digest-qualified R2 object is independently safe to expose and must
              // win before coordinate aliases. The `/github/*` custom-domain route is a
              // Cloudflare proxy that can fetch GitHub Release bytes, so placing it first
              // would turn GitHub into the primary source even when our R2 copy exists.
              if let Some(sha256) = query.sha256.filter(|digest| !digest.is_empty()) {
                  keys.push(format!("{R2_CONTENT_PREFIX}/{sha256}.{ext}"));
              }
              keys.push(format!(
                  "{R2_GITHUB_PREFIX}/{}/{}/{}/{}-{}.{}",
                  github.owner, github.repo, query.vcs_tag, query.name, query.version, ext
              ));
              keys.push(format!(
                  "{R2_PACKAGE_PREFIX}/{}/{}/{}/{}-{}.{}",
                  query.org, query.name, query.version, query.name, query.version, ext
              ));
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected one locator block, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old_expected = '''            vec![
                          "github/acme/http-kit/v1.2.0/http-kit-1.2.0.tar.gz".to_string(),
                          "packages/acme/http-kit/1.2.0/http-kit-1.2.0.tar.gz".to_string(),
                          format!("artifacts/{sha}.tar.gz"),
                      ]
          '''
          new_expected = '''            vec![
                          format!("artifacts/{sha}.tar.gz"),
                          "github/acme/http-kit/v1.2.0/http-kit-1.2.0.tar.gz".to_string(),
                          "packages/acme/http-kit/1.2.0/http-kit-1.2.0.tar.gz".to_string(),
                      ]
          '''
          if text.count(old_expected) != 1:
              raise SystemExit(f'expected one key-order fixture, found {text.count(old_expected)}')
          text = text.replace(old_expected, new_expected, 1)

          marker = '''        assert_eq!(urls[0].0, ArtifactSourceKind::Registry);
                  assert!(urls[0].1.ends_with(&format!("/v1/artifacts/{sha}")));
          '''
          addition = '''        assert_eq!(urls[0].0, ArtifactSourceKind::Registry);
                  assert!(urls[0].1.ends_with(&format!("/v1/artifacts/{sha}")));
                  assert_eq!(
                      urls[1],
                      (
                          ArtifactSourceKind::R2,
                          format!("https://cdn.zpkg.net/artifacts/{sha}.tar.gz"),
                      )
                  );
                  let last_r2 = urls
                      .iter()
                      .rposition(|(kind, _)| *kind == ArtifactSourceKind::R2)
                      .expect("R2 locator");
                  let first_github = urls
                      .iter()
                      .position(|(kind, _)| {
                          matches!(
                              kind,
                              ArtifactSourceKind::GithubRelease
                                  | ArtifactSourceKind::GithubPackages
                                  | ArtifactSourceKind::GithubArchive
                          )
                      })
                      .expect("GitHub locator");
                  assert!(last_r2 < first_github, "every R2 locator must precede GitHub");
          '''
          if text.count(marker) != 1:
              raise SystemExit(f'expected one locator assertion marker, found {text.count(marker)}')
          text = text.replace(marker, addition, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify focused contract
        run: |
          set -euo pipefail
          cargo fmt --all --manifest-path src/rust/Cargo.toml
          cargo test --locked --manifest-path src/rust/Cargo.toml guessed_keys_cover_github_package_and_content_layouts
          cargo test --locked --manifest-path src/rust/Cargo.toml locators_try_registry_then_r2_then_github
          cargo fmt --all --check --manifest-path src/rust/Cargo.toml
          git diff --check

      - name: Commit verified repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/rust/source.rs
          git diff --cached --quiet && exit 0
          git commit -m 'fix: try content-addressed R2 before GitHub proxy'
          git push origin HEAD:fix/r2-before-cloudflare-github-20260910
