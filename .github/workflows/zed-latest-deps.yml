name: Zed latest dependency gate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zed-latest-deps-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  zed-latest-deps:
    name: zed-latest-deps
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ZED_PKG_INTERACTIVE: "false"
      GITHUB_TOKEN: ${{ github.token }}
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ZED_CLI_SHA: 70e02eb7dc9a423d4465fd421ce5b150b16451b6
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Check out compatible Zed CLI by immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zed-pkg/zed-cli
          ref: ${{ env.ZED_CLI_SHA }}
          path: .zed-ci/zed-cli
          persist-credentials: false
      - name: Build exact compatible Zed CLI
        working-directory: .zed-ci/zed-cli
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ZED_CLI_SHA"
          cargo build --locked --bin zed
          mkdir -p "$HOME/.local/bin"
          install -m 0755 target/debug/zed "$HOME/.local/bin/zed"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Report Zed version
        run: zed --version
      - name: Resolve latest allowed dependencies, replay lock, and compile
        shell: bash
        run: bash .githooks/pre-push --ci
