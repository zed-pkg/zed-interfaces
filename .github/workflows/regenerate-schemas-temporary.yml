name: Regenerate native release schemas (temporary)

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  regenerate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/den-100-native-release-routing' &&
      github.actor == 'ORESoftware'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - name: Regenerate committed JSON schemas
        run: cargo run --example generate_schemas
      - name: Commit generated schemas to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schemas/
          if git diff --cached --quiet; then
            echo "Schemas are already current."
            exit 0
          fi
          git commit -m "schemas: add native release routing"
          git push origin HEAD:feat/den-100-native-release-routing
