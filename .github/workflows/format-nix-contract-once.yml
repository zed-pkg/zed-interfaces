name: format Nix contract once

on:
  push:
    branches:
      - agent/den-1417-nix-contract-v1

permissions:
  contents: write

concurrency:
  group: format-nix-contract-once
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out contract branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/den-1417-nix-contract-v1
          persist-credentials: true
          show-progress: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt

      - name: Format and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          rm -- .github/workflows/format-nix-contract-once.yml

          if git diff --quiet --exit-code; then
            echo "No formatting changes were required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "style(DEN-1417): format Nix interop contract"
          git push origin HEAD:agent/den-1417-nix-contract-v1
