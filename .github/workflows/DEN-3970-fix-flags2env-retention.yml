name: DEN-3970 read-only flags2env retention materializer

on:
  push:
    branches:
      - fix/DEN-3970-flags2env-build-output-retention

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Verify exact checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install Rust formatter and Clippy
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt, clippy

      - name: Apply exact reviewed validator and regression patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          old = bytes.fromhex("").decode()
          new = bytes.fromhex("").decode()
          manifest = Path("src/rust/manifest.rs")
          text = manifest.read_text()
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one validator target, found {text.count(old)}")
          manifest.write_text(text.replace(old, new, 1))

          old_valid = bytes.fromhex("").decode()
          new_valid = bytes.fromhex("").decode()
          marker = bytes.fromhex("").decode()
          extra = bytes.fromhex("").decode()
          tests = Path("src/rust/tests/roundtrip.rs")
          text = tests.read_text()
          if text.count(old_valid) != 1:
              raise SystemExit(f"expected exactly one valid fixture target, found {text.count(old_valid)}")
          text = text.replace(old_valid, new_valid, 1)
          if text.count(marker) != 1:
              raise SystemExit(f"expected exactly one missing-output fixture target, found {text.count(marker)}")
          tests.write_text(text.replace(marker, extra + marker, 1))
          PY

      - name: Format and verify semantic fix
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo test --locked flags2env_cli_interop_is_typed_and_fail_closed -- --nocapture
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Prove generated schema shape and change scope
        run: |
          set -euo pipefail
          cargo run --locked --example generate_schemas
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected=$'src/rust/manifest.rs\nsrc/rust/tests/roundtrip.rs'
          test "$actual" = "$expected" || {
            printf 'unexpected materialized paths:\n%s\n' "$actual" >&2
            exit 1
          }

      - name: Stage tested authored files as evidence
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/den-3970-materialized"
          mkdir -p "$evidence/src/rust/tests"
          cp src/rust/manifest.rs "$evidence/src/rust/manifest.rs"
          cp src/rust/tests/roundtrip.rs "$evidence/src/rust/tests/roundtrip.rs"
          git diff --binary -- src/rust/manifest.rs src/rust/tests/roundtrip.rs > "$evidence/tested.patch"
          sha256sum src/rust/manifest.rs src/rust/tests/roundtrip.rs > "$evidence/SHA256SUMS"

      - name: Upload tested materialization
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: den-3970-materialized-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/den-3970-materialized
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
