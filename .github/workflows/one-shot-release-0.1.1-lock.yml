name: One-shot Zed interfaces 0.1.1 lock

on:
  push:
    branches:
      - release/v0.1.1-namespace-contracts-20260915

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Regenerate and validate Cargo lock
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          grep -A2 'name = "zed-interfaces"' Cargo.lock | grep 'version = "0.1.1"'
          cargo fmt --all --check
          cargo check --locked --workspace --all-targets
          cargo test --locked --workspace --all-targets
          git diff --check
      - name: Commit generated lock
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git diff --cached --check
          git commit -m 'release: regenerate Cargo.lock for 0.1.1'
          AUTH="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:release/v0.1.1-namespace-contracts-20260915
