name: agent-nix-plan-schema-generated

on:
  push:
    branches:
      - agent/den-1418-nix-export-plan-schema
    paths:
      - ".github/workflows/agent-nix-plan-schema-generated.yml"

permissions:
  contents: write

concurrency:
  group: den-1418-schema-apply
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/den-1418-nix-export-plan-schema
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt,clippy

      - name: Normalize, validate, generate, commit, and remove this helper
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/nix_plan.rs')
          text = path.read_text()
          replacements = [
              ('use std::path::{Component, Path};', 'use std::path::Path;'),
              (
                  '#[serde(default, skip_serializing_if = "BTreeMap::is_empty")]\n    pub bins:',
                  '#[serde(default)]\n    pub bins:',
              ),
              (
                  '#[serde(default, skip_serializing_if = "Vec::is_empty")]\n    pub dependencies:',
                  '#[serde(default)]\n    pub dependencies:',
              ),
              (
                  '''fn is_safe_relative_path(value: &str) -> bool {
              let path = Path::new(value);
              !value.is_empty()
                  && !path.is_absolute()
                  && path.components().all(|component| {
                      matches!(component, Component::Normal(_))
                          && component.as_os_str().to_str().is_some_and(|part| {
                              !part.is_empty()
                                  && part != "."
                                  && part != ".."
                                  && !part.chars().any(char::is_control)
                          })
                  })
          }''',
                  '''fn is_safe_relative_path(value: &str) -> bool {
              !value.is_empty()
                  && !value.starts_with('/')
                  && !value.ends_with('/')
                  && !value.contains('\\\\')
                  && value.split('/').all(|part| {
                      !part.is_empty()
                          && part != "."
                          && part != ".."
                          && !part.chars().any(char::is_control)
                  })
          }''',
              ),
              (
                  '''        && !value.starts_with(['-', '.'])
                  && !value.ends_with(['-', '.'])''',
                  '''        && !matches!(value.chars().next(), Some('-' | '.'))
                  && !matches!(value.chars().last(), Some('-' | '.'))''',
              ),
              (
                  '''        assert_eq!(decoded["schema"], NIX_EXPORT_PLAN_SCHEMA_V1);
                  assert!(!encoded.contains("registry"));''',
                  '''        assert_eq!(decoded["schema"], NIX_EXPORT_PLAN_SCHEMA_V1);
                  assert_eq!(decoded["bins"], serde_json::json!({}));
                  assert_eq!(decoded["dependencies"], serde_json::json!([]));
                  assert!(!encoded.contains("registry"));''',
              ),
          ]
          for before, after in replacements:
              if before not in text:
                  raise SystemExit(f'normalization anchor not found: {before[:80]!r}')
              text = text.replace(before, after, 1)
          path.write_text(text)
          PY
          cargo fmt --all
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked nix_plan::tests:: -- --test-threads=1
          cargo run --locked --example generate_schemas
          test -s schemas/nix-export-plan.json
          git rm .github/workflows/agent-nix-plan-schema-generated.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/nix_plan.rs src/lib.rs examples/generate_schemas.rs schemas/nix-export-plan.json
          git diff --cached --check
          git commit -m "feat(DEN-1418): apply generated Nix export plan schema"
          git push origin HEAD:agent/den-1418-nix-export-plan-schema
