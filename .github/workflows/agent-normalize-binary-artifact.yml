name: normalize binary artifact branch

on:
  push:
    branches:
      - agent/binary-artifacts-v1

permissions:
  contents: write

concurrency:
  group: normalize-binary-artifact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, '[binary-normalized]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/binary-artifacts-v1
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt
      - name: Register and generate the binary artifact schema
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          index_path = Path('schemas/index.json')
          index = json.loads(index_path.read_text())
          entry = {
              'file': 'binary-artifact-v1.schema.json',
              'targets': [],
              'why': 'Secure in-archive native-binary integrity descriptor consumed by zed-cli and registry verification only.'
          }
          schemas = index['schemas']
          schemas[:] = [item for item in schemas if item['file'] != entry['file']]
          schemas.append(entry)
          schemas.sort(key=lambda item: item['file'])
          index_path.write_text(json.dumps(index, indent=2, ensure_ascii=False) + '\n')

          generator_path = Path('src/rust/examples/generate_schemas.rs')
          generator = generator_path.read_text()
          marker = '    write::<zed_interfaces::Lockfile>(dir, "lockfile");\n'
          addition = marker + '    write::<zed_interfaces::BinaryArtifactManifestV1>(dir, "binary-artifact-v1.schema");\n'
          if 'BinaryArtifactManifestV1' not in generator:
              if marker not in generator:
                  raise SystemExit('schema generator insertion marker not found')
              generator = generator.replace(marker, addition, 1)
              generator_path.write_text(generator)
          PY
          cargo fmt --manifest-path src/rust/Cargo.toml
          cargo run --locked --manifest-path src/rust/Cargo.toml --example generate_schemas
          rm .github/workflows/agent-normalize-binary-artifact.yml
      - name: Commit normalized sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: normalize binary artifact schema [binary-normalized]'
          git push origin HEAD:agent/binary-artifacts-v1
