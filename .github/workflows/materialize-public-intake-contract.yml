name: materialize public intake schema projections

on:
  push:
    branches:
      - feat/public-intake-contract-v1
    paths:
      - .github/workflows/materialize-public-intake-contract.yml

permissions:
  contents: write

concurrency:
  group: materialize-public-intake-contract
  cancel-in-progress: false

jobs:
  generate-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/public-intake-contract-v1
          fetch-depth: 0
          show-progress: false

      - name: Install current Rust formatter and linter
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt,clippy

      - name: Register the Rust authority and schema projections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          lib = Path('src/rust/lib.rs')
          source = lib.read_text(encoding='utf-8')
          needle = 'pub mod paths;\n'
          replacement = needle + 'pub mod public_intake;\n'
          if source.count(needle) != 1:
              raise SystemExit('expected exactly one public module insertion point')
          if 'pub mod public_intake;' not in source:
              source = source.replace(needle, replacement)
          lib.write_text(source, encoding='utf-8', newline='\n')

          generator = Path('src/rust/examples/generate_schemas.rs')
          source = generator.read_text(encoding='utf-8')
          needle = '    // Registry protocol v1 trust, static-read, archive, and publish contracts.\n'
          block = '''    // Public commercial-intake contracts used by the individual and\n    // organization browser roles. Accepted/error envelopes intentionally\n    // contain no submitted contact data.\n    write::<zed_interfaces::public_intake::PreInterestRegistrationRequestV1>(\n        dir,\n        "pre-interest-registration-request-v1",\n    );\n    write::<zed_interfaces::public_intake::QuoteRequestV1>(dir, "quote-request-v1");\n    write::<zed_interfaces::public_intake::PublicIntakeAcceptedV1>(\n        dir,\n        "public-intake-accepted-v1",\n    );\n    write::<zed_interfaces::public_intake::PublicIntakeErrorV1>(\n        dir,\n        "public-intake-error-v1",\n    );\n\n'''
          if source.count(needle) != 1:
              raise SystemExit('expected exactly one schema insertion point')
          if 'pre-interest-registration-request-v1' not in source:
              source = source.replace(needle, block + needle)
          generator.write_text(source, encoding='utf-8', newline='\n')

          index_path = Path('schemas/index.json')
          index = json.loads(index_path.read_text(encoding='utf-8'))
          additions = [
              {
                  'file': 'pre-interest-registration-request-v1.json',
                  'targets': ['dart', 'ts'],
                  'why': 'Individual and organization pre-interest forms submit this strict public write contract.'
              },
              {
                  'file': 'public-intake-accepted-v1.json',
                  'targets': ['dart', 'ts'],
                  'why': 'Both public forms render the generic 202 envelope without reflected contact data.'
              },
              {
                  'file': 'public-intake-error-v1.json',
                  'targets': ['dart', 'ts'],
                  'why': 'Both public forms handle the same closed, PII-free error categories.'
              },
              {
                  'file': 'quote-request-v1.json',
                  'targets': ['dart', 'ts'],
                  'why': 'The organization quote form submits this strict public write contract.'
              },
          ]
          existing = {item['file'] for item in index['schemas']}
          for item in additions:
              if item['file'] not in existing:
                  index['schemas'].append(item)
          index['schemas'].sort(key=lambda item: item['file'])
          index_path.write_text(
              json.dumps(index, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          PY

      - name: Generate and verify every language projection
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked public_intake
          cargo run --locked --example generate_schemas
          node --test codegen/generate.test.mjs
          node codegen/generate.mjs
          node codegen/generate.mjs --check
          cargo test --locked
          git diff --check

      - name: Refuse unrelated generated drift
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r path; do
            case "$path" in
              src/rust/public_intake.rs|src/rust/lib.rs|src/rust/examples/generate_schemas.rs|schemas/index.json|schemas/pre-interest-registration-request-v1.json|schemas/quote-request-v1.json|schemas/public-intake-accepted-v1.json|schemas/public-intake-error-v1.json|src/dart/*|src/ts/*|.github/workflows/materialize-public-intake-contract.yml)
                ;;
              *)
                echo "unexpected drift: $path" >&2
                bad=1
                ;;
            esac
          done < <(git status --short | sed -E 's/^.. //')
          test "$bad" -eq 0

      - name: Remove bootstrap workflow and commit the generated contract
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-public-intake-contract.yml
          git add \
            .github/workflows/materialize-public-intake-contract.yml \
            src/rust/public_intake.rs \
            src/rust/lib.rs \
            src/rust/examples/generate_schemas.rs \
            schemas \
            src/dart \
            src/ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(intake): generate strict v1 client contracts'
          git push origin HEAD:feat/public-intake-contract-v1
