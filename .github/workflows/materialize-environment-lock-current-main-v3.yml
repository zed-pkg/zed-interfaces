name: run robust EnvironmentLock materializer

on:
  push:
    branches:
      - agent/environment-lock-v1-current-main
    paths:
      - .github/scripts/materialize_environment_lock.py
      - .github/workflows/materialize-environment-lock-current-main-v3.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/scripts/materialize_environment_lock.py
      - .github/workflows/materialize-environment-lock-current-main-v3.yml

permissions:
  contents: write

concurrency:
  group: materialize-environment-lock-current-main-v3
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/environment-lock-v1-current-main')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out current-main branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/environment-lock-v1-current-main
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Fetch reviewed lock source
        run: |
          set -euo pipefail
          git fetch --no-tags origin agent/environment-lock-v1-rebased
          git show origin/agent/environment-lock-v1-rebased:src/environment_lock.rs \
            > src/environment_lock.rs

      - name: Compose and harden the current contract
        run: |
          set -euo pipefail
          python3 .github/scripts/materialize_environment_lock.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt,clippy

      - name: Resolve dependencies and validate all contract surfaces
        run: |
          set -euo pipefail
          cargo check
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --locked environment_lock
          cargo test --locked
          cargo test --locked --doc
          cargo clippy --locked --all-targets -- -D warnings
          cargo run --locked --example generate_schemas
          cp schemas/environment-lock-v1.json /tmp/environment-lock-v1.json
          cargo run --locked --example generate_schemas
          cmp /tmp/environment-lock-v1.json schemas/environment-lock-v1.json
          git diff --check

      - name: Commit ordinary source and remove bootstrap files
        run: |
          set -euo pipefail
          rm -f \
            .github/scripts/materialize_environment_lock.py \
            .github/workflows/materialize-environment-lock-current-main.yml \
            .github/workflows/materialize-environment-lock-current-main-v2.yml \
            .github/workflows/materialize-environment-lock-current-main-v3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(DEN-1452): add hardened EnvironmentLock v1'
          git push origin HEAD:agent/environment-lock-v1-current-main
