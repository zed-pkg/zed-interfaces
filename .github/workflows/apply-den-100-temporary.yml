name: Apply DEN-100 native release schema (temporary)

on:
  push:
    branches:
      - feat/den-100-native-release-routing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'zed-pkg/zed-interfaces' && github.actor == 'ORESoftware'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/den-100-native-release-routing
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt
      - name: Apply typed native release routing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/manifest.rs")
          text = path.read_text(encoding="utf-8")

          target_old = '''    #[serde(default, skip_serializing_if = "Option::is_none")]
              pub adapter: Option<String>,
          }

          /// A post-extract build step.'''.replace("              ", "    ")
          target_new = '''    #[serde(default, skip_serializing_if = "Option::is_none")]
              pub adapter: Option<String>,
              /// Optional routing to the target's native ecosystem registry. This is
              /// declarative metadata only: the native manifest remains authoritative,
              /// and arbitrary commands are intentionally not representable here.
              #[serde(default, skip_serializing_if = "Option::is_none")]
              pub native: Option<NativeReleaseSection>,
          }

          #[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize, JsonSchema)]
          pub struct NativeReleaseSection {
              pub registry: NativeRegistry,
              pub package: String,
          }

          #[derive(
              Debug, Clone, Copy, PartialEq, Eq, PartialOrd, Ord, Serialize, Deserialize, JsonSchema,
          )]
          #[serde(rename_all = "kebab-case")]
          pub enum NativeRegistry {
              Npm,
              CratesIo,
          }

          impl NativeRegistry {
              pub fn as_str(self) -> &'static str {
                  match self {
                      Self::Npm => "npm",
                      Self::CratesIo => "crates-io",
                  }
              }

              fn validate_package(self, package: &str) -> Result<(), String> {
                  let valid = match self {
                      Self::Npm => is_valid_npm_package(package),
                      Self::CratesIo => is_valid_crates_package(package),
                  };
                  if valid {
                      Ok(())
                  } else {
                      Err(format!(
                          "package `{package}` is not a valid {} package identity",
                          self.as_str()
                      ))
                  }
              }
          }

          #[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize, JsonSchema)]
          pub struct NativeReleaseRoute {
              pub target: String,
              pub dir: String,
              pub registry: NativeRegistry,
              pub package: String,
          }

          fn is_valid_npm_component(value: &str) -> bool {
              !value.is_empty()
                  && value.len() <= 214
                  && !value.starts_with(['.', '_'])
                  && !value.contains("..")
                  && value.chars().all(|c| {
                      c.is_ascii_lowercase()
                          || c.is_ascii_digit()
                          || matches!(c, '-' | '_' | '.' | '~')
                  })
          }

          fn is_valid_npm_package(value: &str) -> bool {
              if let Some(scoped) = value.strip_prefix('@') {
                  let Some((scope, package)) = scoped.split_once('/') else {
                      return false;
                  };
                  !package.contains('/')
                      && is_valid_npm_component(scope)
                      && is_valid_npm_component(package)
              } else {
                  !value.contains('/') && is_valid_npm_component(value)
              }
          }

          fn is_valid_crates_package(value: &str) -> bool {
              !value.is_empty()
                  && value.len() <= 64
                  && !value.starts_with(['-', '_'])
                  && !value.ends_with(['-', '_'])
                  && value
                      .chars()
                      .all(|c| c.is_ascii_alphanumeric() || matches!(c, '-' | '_'))
          }

          /// A post-extract build step.'''.replace("              ", "    ")
          assert target_old in text, "TargetSection insertion point changed"
          text = text.replace(target_old, target_new, 1)

          error_old = '''    #[error("invalid target `{0}`: {1}")]
              InvalidTarget(String, String),
              #[error("manifest toml error: {0}")]'''.replace("              ", "    ")
          error_new = '''    #[error("invalid target `{0}`: {1}")]
              InvalidTarget(String, String),
              #[error("invalid native release route for target `{0}`: {1}")]
              InvalidNativeRoute(String, String),
              #[error("manifest toml error: {0}")]'''.replace("              ", "    ")
          assert error_old in text, "ManifestError insertion point changed"
          text = text.replace(error_old, error_new, 1)

          maps_old = '''        let mut target_dirs = BTreeMap::<&str, &str>::new();
              let mut published_names = BTreeMap::<String, &str>::new();'''.replace("              ", "    ")
          maps_new = '''        let mut target_dirs = BTreeMap::<&str, &str>::new();
              let mut published_names = BTreeMap::<String, &str>::new();
              let mut native_routes = BTreeMap::<(NativeRegistry, String), &str>::new();'''.replace("              ", "    ")
          assert maps_old in text, "target validation maps changed"
          text = text.replace(maps_old, maps_new, 1)

          adapter_old = '''            if let Some(adapter) = target.adapter.as_deref()
                  && !matches!(adapter, "node" | "java" | "none")
              {
                  return Err(ManifestError::InvalidTarget(
                      name.clone(),
                      format!(
                          "adapter `{adapter}` is unsupported; expected `node`, `java`, or `none`"
                      ),
                  ));
              }
          }'''.replace("              ", "    ")
          adapter_new = '''            if let Some(adapter) = target.adapter.as_deref()
                  && !matches!(adapter, "node" | "java" | "none")
              {
                  return Err(ManifestError::InvalidTarget(
                      name.clone(),
                      format!(
                          "adapter `{adapter}` is unsupported; expected `node`, `java`, or `none`"
                      ),
                  ));
              }
              if let Some(native) = &target.native {
                  if target.dir == "." {
                      return Err(ManifestError::InvalidNativeRoute(
                          name.clone(),
                          "the whole-repository target cannot publish to a native registry"
                              .to_string(),
                      ));
                  }
                  native
                      .registry
                      .validate_package(&native.package)
                      .map_err(|reason| {
                          ManifestError::InvalidNativeRoute(name.clone(), reason)
                      })?;
                  let route = (native.registry, native.package.clone());
                  if let Some(previous) = native_routes.insert(route, name.as_str()) {
                      return Err(ManifestError::InvalidNativeRoute(
                          name.clone(),
                          format!(
                              "{} package `{}` is already routed by target `{previous}`",
                              native.registry.as_str(),
                              native.package
                          ),
                      ));
                  }
              }
          }'''.replace("              ", "    ")
          assert adapter_old in text, "target adapter validation changed"
          text = text.replace(adapter_old, adapter_new, 1)

          method_old = '''    /// Every `(target, published name)` pair this manifest fans out to, sorted
              /// by target for deterministic publish order and output.
              pub fn target_package_names(&self) -> Vec<(String, String)> {'''.replace("              ", "    ")
          method_new = '''    /// Native release routes sorted by target name, suitable for deterministic
              /// credential-free planning before any registry adapter executes.
              pub fn native_release_routes(&self) -> Vec<NativeReleaseRoute> {
                  self.targets
                      .iter()
                      .filter_map(|(target, section)| {
                          section.native.as_ref().map(|native| NativeReleaseRoute {
                              target: target.clone(),
                              dir: section.dir.clone(),
                              registry: native.registry,
                              package: native.package.clone(),
                          })
                      })
                      .collect()
              }

              /// Every `(target, published name)` pair this manifest fans out to, sorted
              /// by target for deterministic publish order and output.
              pub fn target_package_names(&self) -> Vec<(String, String)> {'''.replace("              ", "    ")
          assert method_old in text, "native route method insertion point changed"
          text = text.replace(method_old, method_new, 1)

          path.write_text(text, encoding="utf-8")

          tests = r'''use zed_interfaces::manifest::{Manifest, ManifestError, NativeRegistry};

          fn manifest(targets: &str) -> String {
              format!(
                  r#"
          [package]
          org = "acme"
          name = "clients"
          version = "1.2.3"

          [package.repository]
          url = "https://github.com/acme/clients"

          {targets}
          "#
              )
          }

          #[test]
          fn native_routes_parse_roundtrip_and_stay_sorted() {
              let parsed = Manifest::parse(&manifest(
                  r#"
          [targets.rust]
          dir = "clients/rust"

          [targets.rust.native]
          registry = "crates-io"
          package = "acme-client"

          [targets.nodejs]
          dir = "clients/typescript"
          adapter = "node"

          [targets.nodejs.native]
          registry = "npm"
          package = "@acme/client"
          "#,
              ))
              .unwrap();

              let routes = parsed.native_release_routes();
              assert_eq!(routes.len(), 2);
              assert_eq!(routes[0].target, "nodejs");
              assert_eq!(routes[0].registry, NativeRegistry::Npm);
              assert_eq!(routes[0].package, "@acme/client");
              assert_eq!(routes[1].target, "rust");
              assert_eq!(routes[1].registry, NativeRegistry::CratesIo);

              let encoded = parsed.to_toml_string().unwrap();
              assert!(encoded.contains("[targets.nodejs.native]"));
              assert!(encoded.contains("registry = \"npm\""));
              Manifest::parse(&encoded).unwrap();
          }

          #[test]
          fn whole_repository_target_cannot_route_to_a_native_registry() {
              let error = Manifest::parse(&manifest(
                  r#"
          [targets.repository]
          dir = "."

          [targets.repository.native]
          registry = "npm"
          package = "acme-repository"
          "#,
              ))
              .unwrap_err();
              assert!(matches!(error, ManifestError::InvalidNativeRoute(_, _)));
          }

          #[test]
          fn native_package_identities_are_registry_specific() {
              for targets in [
                  r#"
          [targets.nodejs]
          dir = "clients/typescript"
          [targets.nodejs.native]
          registry = "npm"
          package = "Bad Package"
          "#,
                  r#"
          [targets.rust]
          dir = "clients/rust"
          [targets.rust.native]
          registry = "crates-io"
          package = "acme/client"
          "#,
              ] {
                  assert!(matches!(
                      Manifest::parse(&manifest(targets)),
                      Err(ManifestError::InvalidNativeRoute(_, _))
                  ));
              }
          }

          #[test]
          fn duplicate_native_destinations_are_rejected() {
              let error = Manifest::parse(&manifest(
                  r#"
          [targets.nodejs]
          dir = "clients/typescript"
          [targets.nodejs.native]
          registry = "npm"
          package = "@acme/client"

          [targets.browser]
          dir = "clients/browser"
          [targets.browser.native]
          registry = "npm"
          package = "@acme/client"
          "#,
              ))
              .unwrap_err();
              assert!(matches!(error, ManifestError::InvalidNativeRoute(_, _)));
          }
          '''
          Path("tests/native_release.rs").write_text(
              "\n".join(line[10:] if line.startswith("          ") else line for line in tests.splitlines()) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Format and test
        run: |
          cargo fmt --all
          cargo test --locked
      - name: Commit schema and tests to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/manifest.rs tests/native_release.rs
          git commit -m "feat: declare native release routing"
          git push origin HEAD:feat/den-100-native-release-routing
