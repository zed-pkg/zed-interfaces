name: DEN-1464 refresh lock schema

on:
  push:
    branches:
      - agent/den-1464-strict-frozen-lock-metadata
    paths:
      - '.github/workflows/den-1464-refresh-lock-schema.yml'

permissions:
  contents: write

concurrency:
  group: den-1464-refresh-lock-schema
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor == 'ORESoftware'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: agent/den-1464-strict-frozen-lock-metadata
          persist-credentials: true
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - name: Regenerate the public schemas
        run: cargo run --locked --example generate_schemas
      - name: Require a lock-schema-only generated change
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = schemas/lockfile.json
          git diff --check
      - name: Commit the generated schema
        run: |
          git config user.name 'ORESoftware'
          git config user.email '11139560+ORESoftware@users.noreply.github.com'
          git add schemas/lockfile.json
          git commit -m 'docs(DEN-1464): regenerate strict lockfile schema'
          git push origin HEAD:agent/den-1464-strict-frozen-lock-metadata
