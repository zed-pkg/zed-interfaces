name: promote validated DEN-1450 source on PR

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-den-1450-on-pr.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: promote-den-1450-source-pr
  cancel-in-progress: false

jobs:
  promote:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/den-1450-environment-plan-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/den-1450-environment-plan-v2
          persist-credentials: true
          show-progress: false

      - name: Download and verify the CI-validated source artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '8845882632'
        run: |
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > /tmp/den1450-validated.zip
          mkdir -p /tmp/den1450-validated /tmp/den1450-source
          unzip -q /tmp/den1450-validated.zip -d /tmp/den1450-validated
          cd /tmp/den1450-validated
          sha256sum -c den1450-validated.tar.gz.sha256
          tar -xzf den1450-validated.tar.gz -C /tmp/den1450-source

      - name: Materialize reviewed sources and ordinary CI
        run: |
          install -Dm644 /tmp/den1450-source/src/environment_v2.rs src/environment_v2.rs
          install -Dm644 /tmp/den1450-source/src/lib.rs src/lib.rs
          install -Dm644 /tmp/den1450-source/examples/generate_schemas.rs examples/generate_schemas.rs
          install -Dm644 /tmp/den1450-source/schemas/environment-plan-v1.json schemas/environment-plan-v1.json
          install -Dm644 /tmp/den1450-source/schemas/environment-plan.json schemas/environment-plan.json
          git fetch --no-tags --depth=1 origin main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f \
            .github/workflows/apply-den-1450-environment-v2.yml \
            .github/workflows/apply-den-1450-on-pr.yml \
            .github/workflows/promote-den1450-validated-artifact.yml

      - name: Commit the validated implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(DEN-1450): add EnvironmentPlan v2 contract'
          git push origin HEAD:agent/den-1450-environment-plan-v2
