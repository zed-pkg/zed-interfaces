name: apply DEN-1450 environment plan v2 on PR

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-den-1450-environment-v2.yml
      - .github/workflows/apply-den-1450-on-pr.yml

permissions:
  contents: write

concurrency:
  group: apply-den-1450-environment-v2-pr
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/den-1450-environment-plan-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the implementation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/den-1450-environment-plan-v2
          persist-credentials: true
          show-progress: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt,clippy

      - name: Recover and verify the reviewed source payload
        env:
          PAYLOAD_SHA256: 87d4d0a10bbf87d6fd60d334cf69a53bf0db9be1522f934c858f963892be551e
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/apply-den-1450-environment-v2.yml').read_text()
          payload = source.split("<<'PAYLOAD'\n", 1)[1].split('\nPAYLOAD\n', 1)[0]
          Path('/tmp/den1450.b64').write_text(payload.strip() + '\n')
          PY
          base64 --decode /tmp/den1450.b64 > /tmp/den1450.tar.gz
          echo "$PAYLOAD_SHA256  /tmp/den1450.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/den1450.tar.gz

      - name: Format, generate schemas, and validate
        run: |
          cargo fmt
          cargo run --locked --example generate_schemas
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo test --locked --doc

      - name: Commit the validated implementation
        run: |
          rm .github/workflows/apply-den-1450-environment-v2.yml
          rm .github/workflows/apply-den-1450-on-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(DEN-1450): add EnvironmentPlan v2 task and env model"
          git push origin HEAD:agent/den-1450-environment-plan-v2
