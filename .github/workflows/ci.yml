name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-contract-once:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/den-1417-nix-contract-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out contract branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/den-1417-nix-contract-v1
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt

      - name: Format, restore CI, and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f -- .github/workflows/format-nix-contract-once.yml .github/.format-trigger

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all

          if git diff --cached --quiet --exit-code; then
            echo "No one-shot changes remained."
            exit 0
          fi

          git commit -m "style(DEN-1417): format Nix interop contract"
          git push origin HEAD:agent/den-1417-nix-contract-v1

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          show-progress: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt,clippy

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Doctest
        run: cargo test --locked --doc

      - name: Schemas are up to date
        run: |
          cargo run --locked --example generate_schemas
          git diff --exit-code schemas/ \
            || (echo "schemas/ is stale; run 'cargo run --locked --example generate_schemas' and commit" && exit 1)
