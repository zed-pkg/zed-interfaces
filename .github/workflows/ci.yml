name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-nix-file-format-contract:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/den-1417-nix-manifest-lock-schema'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out contract branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/den-1417-nix-manifest-lock-schema
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt

      - name: Implement, generate schemas, restore CI, and push
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "src/manifest.rs",
              "use crate::language::{Ecosystem, Language};\nuse crate::vcs::Vcs;",
              "use crate::language::{Ecosystem, Language};\nuse crate::nix::NixExportSection;\nuse crate::vcs::Vcs;",
          )

          replace_once(
              "src/manifest.rs",
              '''    #[serde(skip_serializing_if = "Option::is_none")]
              pub native: Option<NativeReleaseSection>,
          }''',
              '''    #[serde(skip_serializing_if = "Option::is_none")]
              pub native: Option<NativeReleaseSection>,
              /// Optional deterministic export of this single-language package as a
              /// standalone Nix flake. Nix is a typed interop adapter, not a native
              /// registry destination, so its intent remains separate from `native`.
              #[serde(skip_serializing_if = "Option::is_none")]
              pub nix: Option<NixExportSection>,
          }''',
          )

          replace_once(
              "src/manifest.rs",
              '''            native: None,
                  }''',
              '''            native: None,
                      nix: None,
                  }''',
          )

          replace_once(
              "src/manifest.rs",
              '''    #[serde(default, skip_serializing_if = "Option::is_none")]
              pub native: Option<NativeReleaseSection>,
              /// Override the ecosystem this target publishes into.''',
              '''    #[serde(default, skip_serializing_if = "Option::is_none")]
              pub native: Option<NativeReleaseSection>,
              /// Optional deterministic Nix export intent for this isolated target.
              #[serde(default, skip_serializing_if = "Option::is_none")]
              pub nix: Option<NixExportSection>,
              /// Override the ecosystem this target publishes into.''',
          )

          replace_once(
              "src/manifest.rs",
              '''    #[error("invalid native release route for target `{0}`: {1}")]
              InvalidNativeRoute(String, String),
              #[error("manifest toml error: {0}")]''',
              '''    #[error("invalid native release route for target `{0}`: {1}")]
              InvalidNativeRoute(String, String),
              #[error("invalid Nix export route for target `{0}`: {1}")]
              InvalidNixRoute(String, String),
              #[error("manifest toml error: {0}")]''',
          )

          replace_once(
              "src/manifest.rs",
              "fn is_valid_npm_component(value: &str) -> bool {",
              '''#[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize, JsonSchema)]
          pub struct NixExportRoute {
              pub target: String,
              pub dir: String,
              pub package: String,
              pub intent: NixExportSection,
          }

          fn is_valid_npm_component(value: &str) -> bool {''',
          )

          replace_once(
              "src/manifest.rs",
              '''        let mut native_routes = BTreeMap::<(NativeRegistry, String), &str>::new();''',
              '''        let mut native_routes = BTreeMap::<(NativeRegistry, String), &str>::new();
                  let mut nix_attributes = BTreeMap::<String, &str>::new();''',
          )

          replace_once(
              "src/manifest.rs",
              '''        for (name, target) in &self.targets {''',
              '''        if let Some(nix) = &self.publish.nix {
                      if !self.targets.is_empty() {
                          return Err(ManifestError::InvalidNixRoute(
                              "repository".to_string(),
                              "root `[publish.nix]` is only valid for a single-language package; \
                               polyglot packages declare `[targets.<language>.nix]`"
                                  .to_string(),
                          ));
                      }
                      nix.validate(&self.package.name).map_err(|error| {
                          ManifestError::InvalidNixRoute(
                              "repository".to_string(),
                              error.to_string(),
                          )
                      })?;
                      nix_attributes.insert(
                          nix.resolved_attribute(&self.package.name),
                          "repository",
                      );
                  }
                  for (name, target) in &self.targets {''',
          )

          replace_once(
              "src/manifest.rs",
              '''            if let Some(adapter) = target.adapter.as_deref()
                          && !ADAPTERS.contains(&adapter)''',
              '''            if let Some(nix) = &target.nix {
                          nix.validate(&published_name).map_err(|error| {
                              ManifestError::InvalidNixRoute(name.clone(), error.to_string())
                          })?;
                          let attribute = nix.resolved_attribute(&published_name);
                          if let Some(previous) = nix_attributes.insert(attribute.clone(), name.as_str()) {
                              return Err(ManifestError::InvalidNixRoute(
                                  name.clone(),
                                  format!(
                                      "Nix attribute `{attribute}` is already used by target `{previous}`"
                                  ),
                              ));
                          }
                      }
                      if let Some(adapter) = target.adapter.as_deref()
                          && !ADAPTERS.contains(&adapter)''',
          )

          replace_once(
              "src/manifest.rs",
              '''    /// Native release routes sorted by target name, suitable for deterministic
              /// credential-free planning before any registry adapter executes.''',
              '''    /// Nix export routes sorted by target name. These contain author intent only;
              /// realization hashes and store paths live in versioned lock provenance.
              pub fn nix_export_routes(&self) -> Vec<NixExportRoute> {
                  let mut routes = Vec::new();
                  if let Some(intent) = &self.publish.nix {
                      routes.push(NixExportRoute {
                          target: "repository".to_string(),
                          dir: ".".to_string(),
                          package: self.package.name.clone(),
                          intent: intent.clone(),
                      });
                  }
                  for (target, section) in &self.targets {
                      if let Some(intent) = &section.nix {
                          routes.push(NixExportRoute {
                              target: target.clone(),
                              dir: section.dir.clone(),
                              package: section
                                  .name
                                  .clone()
                                  .unwrap_or_else(|| format!("{}-{target}", self.package.name)),
                              intent: intent.clone(),
                          });
                      }
                  }
                  routes
              }

              /// Native release routes sorted by target name, suitable for deterministic
              /// credential-free planning before any registry adapter executes.''',
          )

          replace_once(
              "src/manifest.rs",
              '''        derived.publish.native = section.native.clone();''',
              '''        derived.publish.native = section.native.clone();
                  derived.publish.nix = section.nix.clone();''',
          )

          Path("src/lockfile.rs").write_text(r'''use std::collections::BTreeSet;

          use schemars::JsonSchema;
          use serde::{Deserialize, Serialize};

          use crate::artifact::ArtifactFormat;
          use crate::nix::NixAdapterRecord;

          type NixAdapterKey = (String, String, String, Option<String>, u8, String, String);

          /// The `.zpkg.lock` file written next to `.zpkg.toml` after resolution.
          ///
          /// Serialized as TOML with one `[[package]]` table per locked package,
          /// Cargo.lock-style. Every entry pins the exact artifact hash and the VCS
          /// tag it was published from, so installs are reproducible and every
          /// artifact is traceable back to source.
          #[derive(Debug, Clone, PartialEq, Serialize, Deserialize, JsonSchema)]
          pub struct Lockfile {
              pub version: u32,
              #[serde(default, rename = "package", skip_serializing_if = "Vec::is_empty")]
              pub packages: Vec<LockedPackage>,
              /// Optional immutable provenance for completed Nix interoperability
              /// translations. This additive field keeps lockfile version 1 readable by
              /// current consumers while allowing newer writers to preserve evidence.
              #[serde(
                  default,
                  rename = "nix-adapter",
                  skip_serializing_if = "Vec::is_empty"
              )]
              pub nix_adapters: Vec<NixAdapterRecord>,
          }

          #[derive(Debug, Clone, PartialEq, Serialize, Deserialize, JsonSchema)]
          pub struct LockedPackage {
              pub org: String,
              pub name: String,
              pub version: String,
              /// Hex sha256 of the artifact archive; also its store address.
              pub sha256: String,
              /// Artifact size in bytes.
              pub size: u64,
              #[serde(default)]
              pub format: ArtifactFormat,
              /// VCS tag the version was published from, e.g. `v1.2.0`.
              pub vcs_tag: String,
              #[serde(default, skip_serializing_if = "Option::is_none")]
              pub vcs_commit: Option<String>,
              /// Base URL of the registry the artifact was resolved from.
              pub source: String,
          }

          #[derive(Debug, thiserror::Error)]
          pub enum LockfileError {
              #[error("lockfile toml error: {0}")]
              Toml(String),
              #[error("unsupported lockfile version {0} (this build supports {1})")]
              UnsupportedVersion(u32, u32),
              #[error("invalid Nix adapter provenance: {0}")]
              InvalidNixAdapter(String),
              #[error("duplicate Nix adapter provenance key `{0}`")]
              DuplicateNixAdapter(String),
          }

          impl Default for Lockfile {
              fn default() -> Self {
                  Self {
                      version: Self::CURRENT_VERSION,
                      packages: Vec::new(),
                      nix_adapters: Vec::new(),
                  }
              }
          }

          impl Lockfile {
              pub const CURRENT_VERSION: u32 = 1;

              pub fn parse(input: &str) -> Result<Self, LockfileError> {
                  let lockfile: Lockfile =
                      toml::from_str(input).map_err(|error| LockfileError::Toml(error.to_string()))?;
                  if lockfile.version > Self::CURRENT_VERSION {
                      return Err(LockfileError::UnsupportedVersion(
                          lockfile.version,
                          Self::CURRENT_VERSION,
                      ));
                  }
                  lockfile.validate_nix_adapters()?;
                  Ok(lockfile)
              }

              pub fn to_toml_string(&self) -> Result<String, LockfileError> {
                  self.validate_nix_adapters()?;
                  let mut normalized = self.clone();
                  normalized.nix_adapters.sort_by_key(nix_adapter_key);
                  toml::to_string_pretty(&normalized)
                      .map_err(|error| LockfileError::Toml(error.to_string()))
              }

              pub fn find(&self, org: &str, name: &str) -> Option<&LockedPackage> {
                  self.packages
                      .iter()
                      .find(|package| package.org == org && package.name == name)
              }

              /// Insert or replace the entry for `org/name`, keeping entries sorted.
              pub fn upsert(&mut self, package: LockedPackage) {
                  self.packages
                      .retain(|existing| !(existing.org == package.org && existing.name == package.name));
                  self.packages.push(package);
                  self.packages
                      .sort_by(|a, b| (&a.org, &a.name).cmp(&(&b.org, &b.name)));
              }

              /// Insert or replace one completed Nix translation. Identity includes
              /// package/target, direction, system, and selected output, so platform
              /// variants never overwrite each other.
              pub fn upsert_nix_adapter(
                  &mut self,
                  adapter: NixAdapterRecord,
              ) -> Result<(), LockfileError> {
                  adapter
                      .validate()
                      .map_err(|error| LockfileError::InvalidNixAdapter(error.to_string()))?;
                  let key = nix_adapter_key(&adapter);
                  self.nix_adapters
                      .retain(|existing| nix_adapter_key(existing) != key);
                  self.nix_adapters.push(adapter);
                  self.nix_adapters.sort_by_key(nix_adapter_key);
                  Ok(())
              }

              fn validate_nix_adapters(&self) -> Result<(), LockfileError> {
                  let mut seen = BTreeSet::new();
                  for adapter in &self.nix_adapters {
                      adapter
                          .validate()
                          .map_err(|error| LockfileError::InvalidNixAdapter(error.to_string()))?;
                      let key = nix_adapter_key(adapter);
                      if !seen.insert(key) {
                          return Err(LockfileError::DuplicateNixAdapter(
                              nix_adapter_label(adapter),
                          ));
                      }
                  }
                  Ok(())
              }
          }

          impl LockedPackage {
              pub fn full_name(&self) -> String {
                  format!("{}/{}", self.org, self.name)
              }
          }

          fn nix_adapter_key(adapter: &NixAdapterRecord) -> NixAdapterKey {
              match adapter {
                  NixAdapterRecord::ZedToNix { package, .. } => (
                      package.org.clone(),
                      package.name.clone(),
                      package.version.clone(),
                      package.target.clone(),
                      0,
                      String::new(),
                      String::new(),
                  ),
                  NixAdapterRecord::NixToZed {
                      package, source, ..
                  } => (
                      package.org.clone(),
                      package.name.clone(),
                      package.version.clone(),
                      package.target.clone(),
                      1,
                      source.realized.system.clone(),
                      source.realized.output.clone(),
                  ),
              }
          }

          fn nix_adapter_label(adapter: &NixAdapterRecord) -> String {
              let (direction, package, system, output) = match adapter {
                  NixAdapterRecord::ZedToNix { package, .. } => {
                      ("zed-to-nix", package, "-", "-")
                  }
                  NixAdapterRecord::NixToZed {
                      package, source, ..
                  } => (
                      "nix-to-zed",
                      package,
                      source.realized.system.as_str(),
                      source.realized.output.as_str(),
                  ),
              };
              format!(
                  "{}/{}@{} target={} direction={direction} system={system} output={output}",
                  package.org,
                  package.name,
                  package.version,
                  package.target.as_deref().unwrap_or("-")
              )
          }
          ''')

          replace_once(
              "examples/generate_schemas.rs",
              '''    write::<zed_interfaces::Lockfile>(dir, "lockfile");''',
              '''    write::<zed_interfaces::Lockfile>(dir, "lockfile");
                  write::<zed_interfaces::NixExportSection>(dir, "nix-export-section");
                  write::<zed_interfaces::NixAdapterRecord>(dir, "nix-adapter-record");''',
          )

          replace_once(
              "src/lib.rs",
              '''pub use lockfile::{LockedPackage, Lockfile};
          pub use manifest::{Manifest, ManifestError};''',
              '''pub use lockfile::{LockedPackage, Lockfile, LockfileError};
          pub use manifest::{Manifest, ManifestError, NixExportRoute};''',
          )
          PY

          cargo fmt --all
          cargo run --locked --example generate_schemas

          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all

          if git diff --cached --quiet --exit-code; then
            echo "No implementation changes remained."
            exit 0
          fi

          git commit -m "feat(DEN-1417): embed Nix intent and provenance in file formats"
          git push origin HEAD:agent/den-1417-nix-manifest-lock-schema

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          show-progress: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt,clippy

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Doctest
        run: cargo test --locked --doc

      - name: Schemas are up to date
        run: |
          cargo run --locked --example generate_schemas
          git diff --exit-code schemas/ \
            || (echo "schemas/ is stale; run 'cargo run --locked --example generate_schemas' and commit" && exit 1)
