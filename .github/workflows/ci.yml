name: DEN-1565 compose native lock provenance on current main

on:
  pull_request:
    paths:
      - .github/workflows/ci.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: den-1565-native-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact review branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
          show-progress: false
          fetch-depth: 0

      - name: Install stable Rust with formatter and Clippy
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt,clippy

      - name: Apply the reviewed five-file provenance delta with a three-way merge
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            main:refs/remotes/origin/main \
            agent/native-lockfile-provenance:refs/remotes/origin/agent/native-lockfile-provenance
          source_ref=refs/remotes/origin/agent/native-lockfile-provenance
          source_base="$(git merge-base refs/remotes/origin/main "$source_ref")"
          git diff --binary "$source_base" "$source_ref" -- \
            docs/native-dependency-lockfile.md \
            schemas/lockfile.json \
            src/lockfile.rs \
            tests/native_dependency_lockfile_contract.rs \
            tests/native_dependency_lockfile_schema_contract.rs \
            > "$RUNNER_TEMP/native-lock-provenance.patch"
          test -s "$RUNNER_TEMP/native-lock-provenance.patch"
          git apply --3way --index "$RUNNER_TEMP/native-lock-provenance.patch"
          git diff --cached --check

      - name: Format, regenerate schema, and certify the complete crate
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo run --locked --example generate_schemas
          cargo fmt --all -- --check
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets --all-features -- -D warnings
          git diff --check

          changed="$(git diff --name-only HEAD -- \
            docs/native-dependency-lockfile.md \
            schemas/lockfile.json \
            src/lockfile.rs \
            tests/native_dependency_lockfile_contract.rs \
            tests/native_dependency_lockfile_schema_contract.rs | sort)"
          expected="$(printf '%s\n' \
            docs/native-dependency-lockfile.md \
            schemas/lockfile.json \
            src/lockfile.rs \
            tests/native_dependency_lockfile_contract.rs \
            tests/native_dependency_lockfile_schema_contract.rs | sort)"
          test "$changed" = "$expected" || {
            printf 'unexpected product delta:\n%s\n' "$changed" >&2
            exit 1
          }

      - name: Commit and push only certified product files
        run: |
          set -euo pipefail
          git add \
            docs/native-dependency-lockfile.md \
            schemas/lockfile.json \
            src/lockfile.rs \
            tests/native_dependency_lockfile_contract.rs \
            tests/native_dependency_lockfile_schema_contract.rs
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'feat: persist exact native dependencies in zpkg lockfiles'
          git push origin HEAD:${{ github.head_ref }}
