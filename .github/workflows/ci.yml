name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          show-progress: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt,clippy

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Doctest
        run: cargo test --locked --doc

      - name: Schemas are up to date
        run: |
          cargo run --locked --example generate_schemas
          git diff --exit-code schemas/ \
            || (echo "schemas/ is stale; run 'cargo run --locked --example generate_schemas' and commit" && exit 1)

      # The fixtures are what the Dart and TypeScript slices decode. If a serde
      # attribute changes what the wire looks like, this is the gate that says
      # so — the schema can stay identical while the encoding moves.
      - name: Wire-format fixtures are up to date
        run: |
          cargo run --locked --example generate_fixtures
          git diff --exit-code fixtures/ \
            || (echo "fixtures/ is stale; run 'cargo run --locked --example generate_fixtures' and commit" && exit 1)

  # The Dart and TypeScript slices are generated from schemas/. Drift between
  # the Rust source of truth and what a front end compiles against is the whole
  # failure mode this repository exists to prevent, so it is a hard CI gate.
  codegen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          show-progress: false

      - name: Generator unit tests
        run: node --test codegen/generate.test.mjs

      - name: Generated slices are up to date
        run: node codegen/generate.mjs --check

  dart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          show-progress: false

      - name: Install Dart SDK
        uses: dart-lang/setup-dart@e51d8e571e22473a2ddebf0ef8a2123f0ab2c02c # v1.7.1

      - name: Resolve dependencies
        working-directory: src/dart
        run: dart pub get

      # `dart analyze`, not `dart format --set-exit-if-changed`: the generator
      # is the formatter, and its output is deliberately SDK-independent so the
      # drift check above cannot flip with the installed Dart version.
      - name: Analyze
        working-directory: src/dart
        run: dart analyze --fatal-infos

      # Decodes fixtures/*.json — real serde output — with the generated
      # classes. Compiling proves the shape; only this proves the encoding.
      - name: Wire-format tests
        working-directory: src/dart
        run: dart test

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          show-progress: false

      - name: Install dependencies
        working-directory: src/ts
        run: npm install --no-save typescript@5 @types/node

      - name: Typecheck
        working-directory: src/ts
        run: npx tsc --noEmit

      # Node strips the types, so this runs against the shipped source and also
      # proves the generated `.ts` imports resolve at runtime — extensionless
      # ones do not, which tsc alone will not tell you.
      - name: Wire-format tests
        working-directory: src/ts
        run: node --test wire-format.test.ts
