name: materialize Rust 1.98 formatting repair

on:
  push:
    branches:
      - automation/2026-09-01-regenerate-contracts
    paths:
      - .github/workflows/materialize-rustfmt-1-98.yml

permissions:
  contents: write

concurrency:
  group: materialize-rustfmt-1-98
  cancel-in-progress: false

jobs:
  format-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: automation/2026-09-01-regenerate-contracts
          fetch-depth: 0
          show-progress: false

      - name: Install current stable formatter
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt

      - name: Format only the known drift and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            src/rust/manifest.rs \
            src/rust/mirror.rs \
            src/rust/signing.rs | sort)"
          test "$actual" = "$expected"
          rm .github/workflows/materialize-rustfmt-1-98.yml
          git add \
            .github/workflows/materialize-rustfmt-1-98.yml \
            src/rust/manifest.rs \
            src/rust/mirror.rs \
            src/rust/signing.rs
          git diff --cached --check
          staged="$(git diff --cached --name-only | sort)"
          test "$staged" = "$(printf '%s\n' \
            .github/workflows/materialize-rustfmt-1-98.yml \
            src/rust/manifest.rs \
            src/rust/mirror.rs \
            src/rust/signing.rs | sort)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(rust): accept Rust 1.98 formatting'
          git push origin HEAD:automation/2026-09-01-regenerate-contracts
