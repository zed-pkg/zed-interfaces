name: DEN-2735 materialize clean polyglot baseline

on:
  push:
    branches:
      - agent/den-2735-clean-polyglot-layout
    paths:
      - .github/workflows/den-2735-materialize.yml

permissions:
  contents: write

concurrency:
  group: den-2735-materialize
  cancel-in-progress: false

env:
  BASE_MAIN: f793e7c592373242dff9ab855845c42f526db9b4
  REVIEWED_BASELINE: 6ad1ad3c0584a60778bf0d451d9d091ad90e6c0c

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact clean successor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-2735-clean-polyglot-layout
          fetch-depth: 3
          persist-credentials: true
          show-progress: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt,clippy

      - name: Install Dart SDK
        uses: dart-lang/setup-dart@e51d8e571e22473a2ddebf0ef8a2123f0ab2c02c # v1.7.1

      - name: Verify clean provenance root
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$BASE_MAIN")" = "$BASE_MAIN"
          test "$(git diff --name-only "$BASE_MAIN"..HEAD)" = ".github/workflows/den-2735-materialize.yml"
          git fetch --no-tags --depth=1 origin "$REVIEWED_BASELINE"

      - name: Reconstruct reviewed layout on current main
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          moves = {}
          for root, target_root in [(Path('src'), Path('src/rust')), (Path('tests'), Path('src/rust/tests')), (Path('examples'), Path('src/rust/examples'))]:
              if not root.exists():
                  continue
              for path in sorted(root.glob('*.rs')):
                  moves[path.as_posix()] = (target_root / path.name).as_posix()
          Path('/tmp/den2735-moves.json').write_text(json.dumps(moves, indent=2))
          PY

          mkdir -p src/rust src/rust/tests src/rust/examples
          shopt -s nullglob
          for path in src/*.rs; do git mv "$path" src/rust/; done
          for path in tests/*.rs; do git mv "$path" src/rust/tests/; done
          for path in examples/*.rs; do git mv "$path" src/rust/examples/; done
          rmdir tests 2>/dev/null || true
          rmdir examples 2>/dev/null || true
          git mv Cargo.toml src/rust/Cargo.toml

          cat > Cargo.toml <<'EOF'
          # Virtual workspace for the polyglot zed-interfaces repository.
          # The hand-written Rust crate is one language slice beside generated
          # Dart and TypeScript slices.
          [workspace]
          resolver = "3"
          members = ["src/rust"]
          default-members = ["src/rust"]
          EOF

          cat >> src/rust/Cargo.toml <<'EOF'

          # This package lives directly in src/rust rather than src/rust/src.
          [lib]
          path = "lib.rs"
          EOF

          # Import only reviewed polyglot support/hardening files from the final
          # reviewed baseline snapshot. Current Rust, schemas, lockfile, Nix and
          # unrelated current-main files remain authoritative.
          git archive "$REVIEWED_BASELINE" \
            codegen \
            package.json \
            src/dart \
            src/ts \
            fixtures \
            docs/multi-language-layout.md \
            | tar -x
          git show "$REVIEWED_BASELINE:src/rust/examples/generate_fixtures.rs" > src/rust/examples/generate_fixtures.rs
          git show "$REVIEWED_BASELINE:src/rust/tests/own_manifest.rs" > src/rust/tests/own_manifest.rs
          git show "$REVIEWED_BASELINE:schemas/index.json" > schemas/index.json

          # Bring the reviewed multi-language CI/path adaptations forward without
          # replacing unrelated current-main workflows.
          for path in \
            .github/workflows/ci.yml \
            .github/workflows/environment-lock-contract.yml \
            .github/workflows/native-registry.yml \
            .github/workflows/nix.yml
          do
            git show "$REVIEWED_BASELINE:$path" > "$path"
          done

          cat > .zpkg.toml <<'EOF'
          [package]
          org = "zed-pkg"
          name = "zed-interfaces"
          version = "0.1.0"
          description = "Core manifest, lockfile, registry, version, and package-model interfaces for zed-pkg"
          license = "MIT"
          keywords = ["package-manager", "interfaces", "manifest", "lockfile", "polyglot"]

          [package.repository]
          vcs = "git"
          url = "https://github.com/zed-pkg/zed-interfaces"

          [publish]
          include_readme = true
          tag_format = "v{version}"
          smoke_test = "test -f \"$ZED_PKG_TEST_TARGET/schemas/index.json\" && test -f \"$ZED_PKG_TEST_TARGET/src/rust/Cargo.toml\" && test -f \"$ZED_PKG_TEST_TARGET/src/dart/lib/zed_interfaces.dart\" && test -f \"$ZED_PKG_TEST_TARGET/src/ts/index.ts\""
          exclude = [
            ".env",
            ".env.*",
            ".git/**",
            ".github/**",
            ".zed/**",
            ".zed-pack/**",
            "target/**",
            "**/target/**",
            "**/node_modules/**",
            "**/.dart_tool/**",
            "tmp/**",
            "**/*.log",
            ".DS_Store",
          ]

          # Canonical whole-repository slice. DEN-2960 intentionally omits a
          # target-level name here: dir="." publishes as root package.name.
          [targets.repository]
          dir = "."

          [targets.rust]
          dir = "src/rust"
          adapter = "rust"

          [targets.rust.native]
          registry = "crates-io"
          package = "zed-interfaces"

          [targets.dart]
          dir = "src/dart"
          adapter = "dart"

          [targets.dart.native]
          registry = "pub.dev"
          package = "zed_interfaces"
          tag_format = "dart/v{version}"

          [targets.typescript]
          dir = "src/ts"
          name = "zed-interfaces-typescript"
          adapter = "node"

          [targets.typescript.native]
          registry = "npm"
          package = "@zed-pkg/zed-interfaces"
          tag_format = "ts/v{version}"

          [install]
          dir = ".vendor/.zed"

          [scripts]
          test = "cargo test --all-targets --locked && npm test"
          codegen = "cargo run --locked --example generate_schemas && npm run codegen"
          codegen-check = "npm run codegen:check"
          EOF

          python - <<'PY'
          import json
          from pathlib import Path

          # Ignore language-tool scratch state while keeping generated slices tracked.
          ignore = Path('.gitignore')
          text = ignore.read_text() if ignore.exists() else ''
          additions = [
              '/.vendor/',
              'node_modules/',
              'src/dart/.dart_tool/',
              'src/dart/pubspec.lock',
              'src/dart/build/',
          ]
          if additions:
              if text and not text.endswith('\n'):
                  text += '\n'
              text += '\n# Polyglot language-slice tooling state.\n'
              for line in additions:
                  if line not in text.splitlines():
                      text += line + '\n'
          ignore.write_text(text)

          # Rewrite exact moved current-main Rust paths throughout tracked text.
          moves = json.loads(Path('/tmp/den2735-moves.json').read_text())
          extra = {
              'tests/**': 'src/rust/tests/**',
              'examples/**': 'src/rust/examples/**',
              'examples/': 'src/rust/examples/',
          }
          replacements = {**moves, **extra}
          skip_parts = {'.git', 'target', 'node_modules', '.dart_tool'}
          for path in Path('.').rglob('*'):
              if not path.is_file() or any(part in skip_parts for part in path.parts):
                  continue
              try:
                  body = path.read_text()
              except UnicodeDecodeError:
                  continue
              updated = body
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != body:
                  path.write_text(updated)

          # Hand-written Rust source moved one directory deeper. Preserve compile-time
          # repository fixture/schema includes used by current-main contracts such as
          # dependency-graph v1.
          for path in Path('src/rust').glob('*.rs'):
              body = path.read_text()
              body = body.replace('include_str!("../schemas/', 'include_str!("../../schemas/')
              body = body.replace('include_str!("../fixtures/', 'include_str!("../../fixtures/')
              body = body.replace('include_bytes!("../schemas/', 'include_bytes!("../../schemas/')
              body = body.replace('include_bytes!("../fixtures/', 'include_bytes!("../../fixtures/')
              body = body.replace('"../schemas/', '"../../schemas/')
              body = body.replace('"../fixtures/', '"../../fixtures/')
              path.write_text(body)

          # Integration tests moved two levels deeper relative to repository schemas/fixtures.
          for path in Path('src/rust/tests').glob('*.rs'):
              body = path.read_text()
              body = body.replace('include_str!("../schemas/', 'include_str!("../../../schemas/')
              body = body.replace('include_str!("../fixtures/', 'include_str!("../../../fixtures/')
              body = body.replace('include_bytes!("../schemas/', 'include_bytes!("../../../schemas/')
              body = body.replace('include_bytes!("../fixtures/', 'include_bytes!("../../../fixtures/')
              path.write_text(body)

          # Preserve current README/agent guidance and add only the reviewed layout contract.
          readme = Path('README.md')
          body = readme.read_text()
          marker = '## Polyglot contract layout\n'
          if marker not in body:
              body += '''\n\n## Polyglot contract layout\n\nThe hand-written Rust contract lives in `src/rust`. JSON schemas are generated from Rust; the front-end-facing subset is then generated into `src/dart` and `src/ts`. See [`docs/multi-language-layout.md`](docs/multi-language-layout.md). Root `Cargo.toml` is a virtual workspace so git-based Rust consumers continue to resolve the `zed-interfaces` crate.\n\nA whole-repository Zed target uses `dir = "."` and the canonical root package identity `zed-interfaces`; it intentionally has no conflicting target-level `name`.\n'''
          readme.write_text(body)

          agents = Path('agents.md')
          body = agents.read_text()
          marker = '## Polyglot generated-slice contract\n'
          if marker not in body:
              body += '''\n\n## Polyglot generated-slice contract\n\nRust in `src/rust` is hand-written. `schemas/` is generated from Rust, and `src/dart` plus `src/ts` are generated from the front-end-facing schema subset in `schemas/index.json`. Regenerate both hops with `cargo run --locked --example generate_schemas` and `npm run codegen`; never hand-edit generated slice files. Keep the whole-repository target canonical by omitting a target-level `name` for `dir = "."`.\n'''
          agents.write_text(body)

          own = Path('src/rust/tests/own_manifest.rs')
          body = own.read_text()
          needle = '    assert_eq!(manifest.package.name, "zed-interfaces");\n'
          if needle not in body:
              raise SystemExit('own_manifest insertion point drifted')
          body = body.replace(
              needle,
              needle + '    assert_eq!(\n        manifest.target_package_name("repository").as_deref(),\n        Some("zed-interfaces")\n    );\n',
              1,
          )
          own.write_text(body)
          PY

          cat > docs/polyglot-baseline-provenance.md <<'EOF'
          # Clean polyglot baseline provenance

          This layout is reconstructed from canonical `main`, not merged from the historical `baseline/polyglot-layout` branch.

          Reviewed semantic sources preserved:

          - `762071627a6a8ddfc3391cb7ca8ecf7277f21faa` — isolated Rust, Dart and TypeScript slices;
          - `0639a55609eb0927c2bd3a9c7301c2f3dbd601e3` — layout documentation and generated-slice CI;
          - `6ad1ad3c0584a60778bf0d451d9d091ad90e6c0c` — generator ownership, wire-format and runtime hardening.

          The successor starts from `f793e7c592373242dff9ab855845c42f526db9b4`, so later canonical work is preserved, including dependency-graph v1 (#52) and canonical whole-repository identity (#53). Derived schemas, fixtures, Dart and TypeScript are regenerated from that current Rust source rather than copied as authority.

          Historical PR #51 remains preserved as source evidence but is superseded by this clean reconstruction because it carries unrelated autosave ancestry and an obsolete conflicting root-target name.
          EOF

      - name: Regenerate current schemas and classify every schema
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo run --locked --example generate_schemas

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('schemas/index.json')
          index = json.loads(path.read_text())
          existing = {p.name for p in Path('schemas').glob('*.json') if p.name != 'index.json'}
          entries = [e for e in index['schemas'] if e.get('file') in existing]
          known = {e['file'] for e in entries}
          for name in sorted(existing - known):
              entries.append({
                  'file': name,
                  'targets': [],
                  'why': 'Current toolchain/schema contract with no established browser or Flutter wire consumer; keep Rust-only until a concrete front-end decoder exists.'
              })
          index['schemas'] = entries
          path.write_text(json.dumps(index, indent=2) + '\n')
          PY

          cargo run --locked --example generate_fixtures
          node --test codegen/generate.test.mjs
          node codegen/generate.mjs
          node codegen/generate.mjs --check

      - name: Validate current Rust contract after the move
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo test --locked --doc
          cargo test --locked --test own_manifest -- --nocapture
          test -f src/rust/dependency_graph.rs
          test -f src/rust/tests/root_target_identity.rs
          test ! -e src/dependency_graph.rs
          test ! -e tests/root_target_identity.rs
          test ! -e examples/generate_schemas.rs
          grep -F 'dir = "."' .zpkg.toml
          ! grep -F 'name = "zed-interfaces-repository"' .zpkg.toml
          grep -F 'dependency-graph-v1.json' schemas/index.json

      - name: Validate Dart slice
        working-directory: src/dart
        shell: bash
        run: |
          set -euo pipefail
          dart pub get
          dart analyze --fatal-infos
          dart test

      - name: Validate TypeScript slice
        working-directory: src/ts
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false typescript@5 @types/node
          npx tsc --noEmit
          node --test wire-format.test.ts

      - name: Verify generated outputs and path migration
        shell: bash
        run: |
          set -euo pipefail
          node codegen/generate.mjs --check
          cargo run --locked --example generate_schemas
          git diff --exit-code schemas/ fixtures/dependency-graph-v1/ \
            || (echo 'generated Rust schemas/graph fixtures drift after second pass' && exit 1)
          cargo run --locked --example generate_fixtures
          git diff --exit-code fixtures/ \
            || (echo 'wire fixtures drift after second pass' && exit 1)
          git diff --check
          if git diff --name-only "$BASE_MAIN" | grep -Eq '^(\.claude/|\.gemini/|\.openai/)'; then
            echo 'snapshot/agent-history files are outside DEN-2735 successor scope' >&2
            exit 1
          fi

      - name: Commit verified semantic reconstruction and self-remove
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/den-2735-materialize.yml
          git config user.name "DEN-2735 clean baseline materializer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          test -z "$(git diff --cached --name-only | grep -E '^(\.claude/|\.gemini/|\.openai/)' || true)"
          test -z "$(git diff --cached --name-only | grep -F '.github/workflows/den-2735-materialize.yml' || true)" || true
          git commit -m "feat(DEN-2735): reconstruct clean polyglot interface layout"
          git push origin HEAD:agent/den-2735-clean-polyglot-layout
