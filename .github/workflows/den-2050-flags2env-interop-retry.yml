name: DEN-2050 flags-2-env manifest interop retry

on:
  push:
    branches: [DEN-2050-flags2env-cli-contract]
    paths:
      - '.github/workflows/den-2050-flags2env-interop-retry.yml'

permissions:
  contents: write

concurrency:
  group: den-2050-flags2env-interop-retry
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: DEN-2050-flags2env-cli-contract
          persist-credentials: true
          show-progress: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt,clippy

      - name: Apply the reviewed typed-contract patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/den-2050-flags2env-interop-bootstrap.yml').read_text()
          start = "          python3 - <<'PY'\n"
          end = "\n          PY\n"
          if start not in workflow:
              raise SystemExit('embedded patch start marker not found')
          script = workflow.split(start, 1)[1].split(end, 1)[0]
          exec(compile(dedent(script), '<flags2env-manifest-patch>', 'exec'), {})

          manifest = Path('src/rust/manifest.rs')
          lines = manifest.read_text().splitlines()
          block_start = next(
              (
                  index
                  for index, line in enumerate(lines)
                  if line.strip() == 'if let Some(build) = &self.build {'
                  and any(
                      'build.outputs must retain flags contract' in candidate
                      for candidate in lines[index:index + 12]
                  )
              ),
              None,
          )
          if block_start is None:
              raise SystemExit('generated build-output validation block not found')
          indent = lines[block_start][:-len(lines[block_start].lstrip())]
          block_end = next(
              (
                  index
                  for index in range(block_start + 1, len(lines))
                  if lines[index] == f'{indent}}}'
              ),
              None,
          )
          if block_end is None:
              raise SystemExit('generated build-output validation block did not close')
          replacement = [
              f'{indent}if self.build.as_ref().is_some_and(|build| {{',
              f'{indent}    !build.outputs.is_empty()',
              f'{indent}        && !build.outputs.iter().any(|output| output == config)',
              f'{indent}}}) {{',
              f'{indent}    return Err(ManifestError::InvalidFlags2EnvInterop(format!(',
              f'{indent}        "build.outputs must retain flags contract `{{config}}`"',
              f'{indent}    )));',
              f'{indent}}}',
          ]
          lines[block_start:block_end + 1] = replacement
          manifest.write_text('\n'.join(lines) + '\n')
          PY

      - name: Format and regenerate public contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo run --locked --example generate_schemas
          node codegen/generate.mjs

      - name: Test the regenerated contract
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings

      - name: Commit tested generated contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/rust/manifest.rs src/rust/tests/roundtrip.rs schemas/manifest.json src/ts src/dart
          if git diff --cached --quiet; then
            echo 'No generated changes remain.'
            exit 0
          fi
          git diff --cached --stat
          git commit -m 'feat(DEN-2050): add flags-2-env CLI package interop'
          git push origin HEAD:refs/heads/DEN-2050-flags2env-cli-contract
