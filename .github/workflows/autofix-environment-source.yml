name: check environment source formatting

on:
  pull_request:
    paths:
      - src/environment.rs
      - rust-toolchain.toml
      - .github/workflows/autofix-environment-source.yml

permissions:
  contents: read

concurrency:
  group: environment-source-format-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Install committed Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          toolchain="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --no-self-update
          rustup default "$toolchain"

      - name: Verify formatting without mutating the branch
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          git diff --exit-code -- .
