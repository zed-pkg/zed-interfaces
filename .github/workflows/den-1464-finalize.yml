name: DEN-1464 finalize strict lock contract

on:
  push:
    branches:
      - agent/den-1464-strict-frozen-lock-metadata
    paths:
      - '.github/workflows/den-1464-finalize.yml'

permissions:
  contents: write

concurrency:
  group: den-1464-finalize
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor == 'ORESoftware'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: agent/den-1464-strict-frozen-lock-metadata
          persist-credentials: true
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt
      - name: Apply native formatting and regenerate schemas
        run: |
          cargo fmt
          cargo run --locked --example generate_schemas
      - name: Require only semantic generated outputs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = schemas/lockfile.json
          test "${changed[1]}" = src/lockfile.rs
          git diff --check
      - name: Commit the finalized contract
        run: |
          git config user.name 'ORESoftware'
          git config user.email '11139560+ORESoftware@users.noreply.github.com'
          git add src/lockfile.rs schemas/lockfile.json
          git commit -m 'style(DEN-1464): finalize immutable revision contract'
          git push origin HEAD:agent/den-1464-strict-frozen-lock-metadata
