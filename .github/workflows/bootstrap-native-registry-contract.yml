name: Bootstrap native registry contract

on:
  push:
    branches:
      - agent/native-registry-semver-contract
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-native-registry-contract
  cancel-in-progress: true

jobs:
  validate-and-materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/native-registry-semver-contract
          fetch-depth: 0
          persist-credentials: true

      - name: Install stable Rust with formatter and Clippy
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version --verbose
          cargo --version --verbose

      - name: Generate checked-in schemas
        run: |
          set -euo pipefail
          cargo run --locked --example generate_schemas

      - name: Format and validate the complete crate
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets --all-features -- -D warnings
          git diff --check

      - name: Commit only the reviewed product result
        run: |
          set -euo pipefail
          git rm .github/workflows/bootstrap-native-registry-contract.yml
          git add src/native_registry.rs src/lib.rs examples/generate_schemas.rs \
            schemas/native-registry-adapter-record.json \
            tests/native_registry_schema_contract.rs \
            docs/native-registry-contract.md
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(DEN-1420): materialize native registry contract"
          git push origin HEAD:agent/native-registry-semver-contract
