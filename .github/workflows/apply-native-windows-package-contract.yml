name: apply native Windows package contract

on:
  push:
    branches: [feat/native-windows-package-contract]

permissions:
  contents: write

concurrency:
  group: native-windows-package-contract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.88.0"
          components: rustfmt
      - name: Apply exact-string contract patch
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition 2024 tools/apply-windows-package-contract.rs -o "$RUNNER_TEMP/apply-windows-package-contract"
          "$RUNNER_TEMP/apply-windows-package-contract"
          cargo fmt --all -- --check
      - name: Prove manifest semantics
        run: cargo test -p zed-interfaces --locked --test windows_package_commands
      - name: Commit generated source patch once
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/rust/manifest.rs; then
            echo "manifest already contains the native Windows contract"
            exit 0
          fi
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/rust/manifest.rs
          git commit -m "feat: add native Windows package command contract"
          git push origin HEAD:feat/native-windows-package-contract
