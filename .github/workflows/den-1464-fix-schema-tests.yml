name: DEN-1464 fix strict lock schema tests

on:
  push:
    branches:
      - agent/den-1464-strict-frozen-lock-metadata
    paths:
      - '.github/workflows/den-1464-fix-schema-tests.yml'

permissions:
  contents: write

concurrency:
  group: den-1464-fix-schema-tests
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor == 'ORESoftware'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: agent/den-1464-strict-frozen-lock-metadata
          persist-credentials: true
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Fix schema requiredness and VCS fixtures
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/lockfile.rs')
          text = path.read_text()

          old_attr = '''    #[schemars(
                  required,
                  length(min = 7, max = 128),
                  regex(pattern = r"^[A-Za-z0-9._+:/-]+$")
              )]'''.replace('              ', '    ')
          new_attr = '''    #[schemars(
                  !default,
                  required,
                  length(min = 7, max = 128),
                  regex(pattern = r"^[A-Za-z0-9._+:/-]+$")
              )]'''.replace('              ', '    ')
          if text.count(old_attr) != 1:
              raise SystemExit(f'expected one schemars attribute, found {text.count(old_attr)}')
          text = text.replace(old_attr, new_attr, 1)

          old_mutable = '''        let original = "0123456789abcdef0123456789abcdef01234567";
                  for replacement in [
                      "main",
                      "refs/heads/main",
                      "latest",
                      "0000000",
                      "short",
                      "revision with spaces",
                      "revision@host",
                  ] {
                      let input = VALID_LOCK.replacen(original, replacement, 1);'''.replace('                  ', '        ')
          new_mutable = '''        for replacement in [
                      "main",
                      "refs/heads/main",
                      "latest",
                      "0000000",
                      "short",
                      "revision with spaces",
                      "revision@host",
                  ] {
                      let input = VALID_LOCK.replacen(
                          "vcs_commit = \\"0123456789abcdef0123456789abcdef01234567\\"",
                          &format!("vcs_commit = \\"{replacement}\\""),
                          1,
                      );'''.replace('                  ', '        ')
          if text.count(old_mutable) != 1:
              raise SystemExit(f'expected one mutable fixture block, found {text.count(old_mutable)}')
          text = text.replace(old_mutable, new_mutable, 1)

          old_non_git = '''            let input =
                          VALID_LOCK.replacen("0123456789abcdef0123456789abcdef01234567", revision, 1);'''.replace('                          ', '                ')
          new_non_git = '''            let input = VALID_LOCK.replacen(
                          "vcs_commit = \\"0123456789abcdef0123456789abcdef01234567\\"",
                          &format!("vcs_commit = \\"{revision}\\""),
                          1,
                      );'''.replace('                          ', '                ')
          if text.count(old_non_git) != 1:
              raise SystemExit(f'expected one non-git fixture block, found {text.count(old_non_git)}')
          text = text.replace(old_non_git, new_non_git, 1)

          path.write_text(text)

      - name: Format and verify the complete contract
        run: |
          cargo fmt
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo run --locked --example generate_schemas
          cargo test --locked lockfile::tests::public_schema_requires_complete_package_provenance
          git diff --check

      - name: Remove the one-shot workflow and commit
        run: |
          git rm .github/workflows/den-1464-fix-schema-tests.yml
          git config user.name 'ORESoftware'
          git config user.email '11139560+ORESoftware@users.noreply.github.com'
          git add src/lockfile.rs schemas/lockfile.json
          git diff --cached --check
          git commit -m 'fix(DEN-1464): require VCS commit in schema and test exact field'
          git push origin HEAD:agent/den-1464-strict-frozen-lock-metadata
