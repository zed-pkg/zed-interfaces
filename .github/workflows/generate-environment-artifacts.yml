name: generate environment contract artifacts

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - src/environment.rs
      - src/lib.rs
      - examples/generate_schemas.rs
      - schemas/environment-plan.json
      - .github/workflows/generate-environment-artifacts.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          show-progress: false

      - name: Verify exact candidate and install committed Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          toolchain="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
          [[ "$toolchain" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default "$toolchain"
          test "$(rustc --version | awk '{print $2}')" = "$toolchain"

      - name: Generate lock and schemas
        run: cargo run --locked --example generate_schemas

      - name: Verify formatting and tests
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          git diff --check

      - name: Upload generated artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: environment-contract-artifacts
          path: |
            Cargo.lock
            schemas/environment-plan.json
          if-no-files-found: warn
          retention-days: 1
