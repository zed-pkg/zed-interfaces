name: Apply DEN-100 native release schema from PR (temporary)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/den-100-native-release-routing' &&
      github.actor == 'ORESoftware'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt
      - name: Apply typed native release routing
        run: python3 scripts/apply_native_release_schema.py
      - name: Format and test
        run: |
          cargo fmt --all
          cargo test --locked
      - name: Commit schema to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/manifest.rs tests/native_release.rs
          if git diff --cached --quiet; then
            echo "Schema and tests are already current."
            exit 0
          fi
          git commit -m "feat: declare native release routing"
          git push origin HEAD:feat/den-100-native-release-routing
