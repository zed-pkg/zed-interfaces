name: Apply DEN-100 native release schema from PR (temporary)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/den-100-native-release-routing' &&
      github.actor == 'ORESoftware'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt
      - name: Reuse and execute the reviewed patch body
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/apply-den-100-temporary.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY", start)
          block = source[start:end]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in block.splitlines()
          )
          exec(compile(script, 'apply-den-100', 'exec'))
          PY
      - name: Format and test
        run: |
          cargo fmt --all
          cargo test --locked
      - name: Commit schema and tests to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/manifest.rs tests/native_release.rs
          if git diff --cached --quiet; then
            echo "Schema and tests are already current."
            exit 0
          fi
          git commit -m "feat: declare native release routing"
          git push origin HEAD:feat/den-100-native-release-routing
