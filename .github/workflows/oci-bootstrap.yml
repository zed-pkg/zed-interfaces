name: oci-contract-bootstrap

on:
  pull_request:
    paths:
      - src/oci.rs
      - src/lib.rs
      - examples/generate_schemas.rs
      - schemas/oci-adapter-record.json
      - .github/workflows/oci-bootstrap.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all
      - name: Check
        run: cargo check --all-targets
      - name: Test OCI contract
        run: cargo test oci --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Generate JSON schemas
        run: cargo run --example generate_schemas
      - name: Preserve formatted sources and schema
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oci-contract-bootstrap
          if-no-files-found: error
          path: |
            src/oci.rs
            src/lib.rs
            examples/generate_schemas.rs
            schemas/oci-adapter-record.json
