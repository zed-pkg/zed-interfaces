name: oci-contract-bootstrap

on:
  pull_request:
    paths:
      - src/oci.rs
      - src/lib.rs
      - examples/generate_schemas.rs
      - schemas/oci-adapter-record.json
      - .github/workflows/oci-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: oci-contract-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all
      - name: Commit formatted sources without force-pushing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/oci.rs src/lib.rs examples/generate_schemas.rs
          if ! git diff --cached --quiet; then
            git commit -m "style: format OCI interoperability contract"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
      - name: Check
        run: cargo check --all-targets
      - name: Test OCI contract
        run: cargo test oci --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Generate JSON schemas
        run: cargo run --example generate_schemas
      - name: Commit generated OCI schema without force-pushing
        run: |
          git add schemas/oci-adapter-record.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: generate OCI adapter JSON schema"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
