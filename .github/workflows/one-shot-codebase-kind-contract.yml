name: one-shot codebase kind contract

on:
  push:
    branches:
      - feat/codebase-kind-contract-127

permissions:
  contents: write

concurrency:
  group: one-shot-codebase-kind-contract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt,clippy

      - name: Apply typed codebase-kind contract
        shell: bash
        run: |
          python3 - <<'PY'
          from base64 import b64decode
          from pathlib import Path

          def d(value: str) -> str:
              return b64decode(value).decode()

          path = Path("src/rust/manifest.rs")
          text = path.read_text()
          replacements = [
              ("I1tkZXJpdmUoRGVidWcsIENsb25lLCBQYXJ0aWFsRXEsIFNlcmlhbGl6ZSwgRGVzZXJpYWxpemUsIEpzb25TY2hlbWEpXQpwdWIgc3RydWN0IFBhY2thZ2VTZWN0aW9uIHs=", ""),
              ("ICAgIHB1YiBuYW1lOiBTdHJpbmcsCiAgICAvLy8gVmVyc2lvbiBvZiB0aGlzIHBhY2thZ2UsIGludGVycHJldGVkIGFjY29yZGluZyB0byBgdmVyc2lvbl9zY2hlbWVg", ""),
              ("ICAgIHB1YiBkaXI6IFN0cmluZywKICAgIC8vLyBQdWJsaXNoZWQgcGFja2FnZSBuYW1lIGZvciB0aGlzIHRhcmdldC4=", ""),
              ("aW1wbCBUYXJnZXRTZWN0aW9uIHsKICAgIC8vLyBUaGUgbGFuZ3VhZ2UgdGhpcyB0YXJnZXQgc2hpcHMsIGZyb20gaXRzIGV4cGxpY2l0IGtleS4=", ""),
              ("ICAgICAgICBkZXJpdmVkLnBhY2thZ2UubmFtZSA9IG5hbWU7CiAgICAgICAgZGVyaXZlZC5wYWNrYWdlLmRlc2NyaXB0aW9uID0gU29tZShtYXRjaCAmc2VsZi5wYWNrYWdlLmRlc2NyaXB0aW9uIHs=", "ICAgICAgICBkZXJpdmVkLnBhY2thZ2UubmFtZSA9IG5hbWU7CiAgICAgICAgZGVyaXZlZC5wYWNrYWdlLmtpbmQgPSBzZWN0aW9uLmVmZmVjdGl2ZV9raW5kKHNlbGYucGFja2FnZS5raW5kKTsKICAgICAgICBkZXJpdmVkLnBhY2thZ2UuZGVzY3JpcHRpb24gPSBTb21lKG1hdGNoICZzZWxmLnBhY2thZ2UuZGVzY3JpcHRpb24gew=="),
              ("ICAgIHB1YiBmbiBpc19wb2x5Z2xvdCgmc2VsZikgLT4gYm9vbCB7CiAgICAgICAgIXNlbGYudGFyZ2V0cy5pc19lbXB0eSgpCiAgICB9CgogICAgLy8vIFRoZSBwYWNrYWdlIG5hbWUgYSB0YXJnZXQgcHVibGlzaGVzIHVuZGVyLg==", ""),
          ]
          for old_b64, new_b64 in replacements:
              old, new = d(old_b64), d(new_b64)
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one manifest anchor, got {text.count(old)}")
              text = text.replace(old, new, 1)
          path.write_text(text)

          lib = Path("src/rust/lib.rs")
          lib_text = lib.read_text()
          old = d("cHViIHVzZSBtYW5pZmVzdDo6ewogICAgR2l0SW50ZXJvcFNlY3Rpb24sIEluc3RhbGxIb29rc1NlY3Rpb24sIEludGVyb3BTZWN0aW9uLCBNYW5pZmVzdCwgTWFuaWZlc3RFcnJvciw=")
          new = d("cHViIHVzZSBtYW5pZmVzdDo6ewogICAgQ29kZWJhc2VLaW5kLCBHaXRJbnRlcm9wU2VjdGlvbiwgSW5zdGFsbEhvb2tzU2VjdGlvbiwgSW50ZXJvcFNlY3Rpb24sIE1hbmlmZXN0LCBNYW5pZmVzdEVycm9yLA==")
          if lib_text.count(old) != 1:
              raise SystemExit("expected manifest re-export anchor exactly once")
          lib.write_text(lib_text.replace(old, new, 1))

          test_b64 = ""
          Path("src/rust/tests/codebase_kind.rs").write_bytes(b64decode(test_b64))
          PY

      - name: Format source
        run: cargo fmt --all

      - name: Run focused codebase-kind tests
        run: cargo test --locked --test codebase_kind

      - name: Regenerate Rust-authoritative schemas
        run: cargo run --locked --example generate_schemas

      - name: Recheck generated manifest schema contract
        run: cargo test --locked --test manifest_schema_contract

      - name: Verify no whitespace damage
        run: git diff --check

      - name: Commit generated contract and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/one-shot-codebase-kind-contract.yml
          git add src/rust/manifest.rs src/rust/lib.rs src/rust/tests/codebase_kind.rs schemas/manifest.json
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add typed codebase kind manifest contract"
          git push origin HEAD:feat/codebase-kind-contract-127
