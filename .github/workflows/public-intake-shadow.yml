name: public intake schema shadows

on:
  pull_request:
    paths:
      - "src/rust/public_intake.rs"
      - "schemas/*public-intake*.json"
      - "schemas/pre-interest-registration-request-v1.json"
      - "schemas/quote-request-v1.json"
      - "contracts/public-intake/**"
      - "proto/**"
      - "codegen/public-intake-shadow.test.mjs"
      - ".github/workflows/public-intake-shadow.yml"
  push:
    branches: [main]
    paths:
      - "src/rust/public_intake.rs"
      - "schemas/*public-intake*.json"
      - "schemas/pre-interest-registration-request-v1.json"
      - "schemas/quote-request-v1.json"
      - "contracts/public-intake/**"
      - "proto/**"
      - "codegen/public-intake-shadow.test.mjs"
      - ".github/workflows/public-intake-shadow.yml"

permissions:
  contents: read

concurrency:
  group: public-intake-shadow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-conform:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          show-progress: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install Buf 1.72.0
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: "1.72.0"
          github_token: ${{ github.token }}

      - name: Verify semantic parity across every representation
        run: node --test codegen/public-intake-shadow.test.mjs

      - name: Compile TypeSpec with exact reviewed tooling
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/typespec" \
            --ignore-scripts --no-audit --no-fund \
            @typespec/compiler@1.15.0 \
            @typespec/http@1.15.0
          test ! -e node_modules
          ln -s "$RUNNER_TEMP/typespec/node_modules" node_modules
          trap 'rm -f node_modules' EXIT
          "$RUNNER_TEMP/typespec/node_modules/.bin/tsp" compile \
            contracts/public-intake/v1/main.tsp --no-emit

      - name: Format, lint, and compile Protobuf
        shell: bash
        run: |
          set -euo pipefail
          buf format --diff --exit-code proto
          buf lint proto
          buf build proto -o "$RUNNER_TEMP/zed-public-intake-v1.binpb"
          test -s "$RUNNER_TEMP/zed-public-intake-v1.binpb"
