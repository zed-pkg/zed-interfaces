name: materialize public intake proto format

on:
  push:
    branches:
      - feat/public-intake-typespec-protobuf-v1
    paths:
      - .materialize-public-intake-proto-format-trigger

permissions:
  contents: write

concurrency:
  group: materialize-public-intake-proto-format
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/public-intake-typespec-protobuf-v1
          persist-credentials: true
          show-progress: false

      - name: Install Buf 1.72.0
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: "1.72.0"
          github_token: ${{ github.token }}

      - name: Format, verify, and commit
        shell: bash
        run: |
          set -euo pipefail
          buf format -w proto
          buf format --diff --exit-code proto
          buf lint proto
          buf build proto -o "$RUNNER_TEMP/zed-public-intake-v1.binpb"
          test -s "$RUNNER_TEMP/zed-public-intake-v1.binpb"
          node --test codegen/public-intake-shadow.test.mjs
          rm -f \
            .github/workflows/materialize-public-intake-proto-format.yml \
            .materialize-public-intake-proto-format-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style(intake): apply canonical Protobuf formatting"
          git push origin HEAD:feat/public-intake-typespec-protobuf-v1
