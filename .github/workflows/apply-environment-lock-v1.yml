name: integrate environment lock v1

on:
  push:
    branches:
      - agent/environment-lock-v1
    paths:
      - .github/workflows/apply-environment-lock-v1.yml

permissions:
  contents: write

concurrency:
  group: integrate-environment-lock-v1
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out contract branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/environment-lock-v1
          persist-credentials: true
          show-progress: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt,clippy

      - name: Expose contract and apply portability-safe Rust patterns
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/environment_lock.rs')
          text = source.read_text()
          text = text.replace(
              "&& !name.contains(['/', '\\\\'])",
              "&& !name.contains('/') && !name.contains('\\\\')",
          )
          text = text.replace(
              "|| value.starts_with(['^', '~', '>', '<', '='])",
              "|| value.chars().next().is_some_and(|character| matches!(character, '^' | '~' | '>' | '<' | '='))",
          )
          source.write_text(text)

          lib = Path('src/lib.rs')
          lib_text = lib.read_text()
          declaration = 'pub mod environment_lock;'
          if declaration not in lib_text:
              if not lib_text.endswith('\n'):
                  lib_text += '\n'
              lib_text += f'\n{declaration}\n'
              lib.write_text(lib_text)
          PY

      - name: Format, test, lint, and generate schema
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --locked environment_lock
          cargo test --locked
          cargo test --locked --doc
          cargo clippy --locked --all-targets -- -D warnings
          cargo run --locked --example generate_environment_lock_schema
          test -s schemas/environment-lock-v1.json

      - name: Remove bootstrap workflow and commit ordinary contract
        run: |
          rm .github/workflows/apply-environment-lock-v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: expose exact environment lock contract'
          git push origin HEAD:agent/environment-lock-v1
