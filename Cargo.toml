[package]
name = "zed-interfaces"
version = "0.1.0"
edition = "2024"
description = "Core interface definitions for the zed-pkg universal package manager"
license = "MIT"
repository = "https://github.com/zed-pkg/zed-interfaces"

[dependencies]
schemars = "1.2.1"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
toml = "1.1.3"
