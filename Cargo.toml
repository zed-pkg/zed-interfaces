# Virtual workspace. The `zed-interfaces` crate itself lives in `src/rust/`,
# beside the generated `src/dart/` and `src/ts/` slices.
#
# The root stays a workspace (rather than the crate) for two reasons:
#   * `.zpkg.toml` publishes each language slice as its own zed-package, and a
#     target may not own `dir = "."`, so the Rust slice needs its own subtree.
#   * `zed-interfaces = { git = "…/zed-interfaces" }` consumers keep resolving,
#     because Cargo finds the package through this workspace's members.
#
# Sibling repos that used `{ path = "../zed-interfaces" }` must now point at
# `{ path = "../zed-interfaces/src/rust" }`.
[workspace]
resolver = "3"
members = ["src/rust"]
default-members = ["src/rust"]

# --- functional programming conformance -------------------------------------
# Warn level only: these never fail a build. They fail `cargo clippy -- -D warnings`
# in the nightly job. See FP-GUIDELINES.md for the principle behind each group.

[workspace.lints.rust]
unsafe_code = "warn"
unused_must_use = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
# typed errors: panicking is not error handling
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
indexing_slicing = "warn"
# illegal states excluded by types
wildcard_enum_match_arm = "warn"
match_wildcard_for_single_variants = "warn"
# immutable values and pure transformations
mut_mut = "warn"
needless_pass_by_ref_mut = "warn"
# composition
too_many_lines = "warn"
cognitive_complexity = "warn"
module_name_repetitions = "allow"
# explicit inputs and outputs
must_use_candidate = "warn"
return_self_not_must_use = "warn"
